name: family_code
description: "Code de la famille de la RDC — édition numérique hors-ligne"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.3.0
  collection: ^1.19.1
  package_info_plus: ^10.2.1
  riverpod_annotation: ^4.0.3
  url_launcher: ^6.3.2
  upgrader: ^13.5.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.3.2
  shared_preferences: ^2.5.5
  drift: ^2.34.2
  path_provider: ^2.1.6
  path: ^1.9.1
  sqlite3: ^3.5.0
  freezed_annotation: ^3.1.0
  fpdart: ^1.2.0
  logger: ^2.7.0
  yaml: ^3.1.3
  shimmer: ^3.0.0
  flutter_svg: ^2.3.0
  adaptive_dialog: ^2.8.0
  flutter_tts: ^4.2.5
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  string_extensions: ^0.8.4
  diacritic: ^0.1.6
  fuzzy: ^0.5.1
  json_annotation: ^4.12.0
  share_plus: ^13.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  go_router_builder: ^4.3.1
  riverpod_lint: ^3.1.4
  riverpod_generator: ^4.0.4
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.34.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/manifest.yaml
    - assets/data/00_textes_normatifs.yaml
    - assets/data/00_types_division.yaml
    - assets/data/livre_1.yaml
    - assets/data/livre_2.yaml
    - assets/data/livre_3.yaml
    - assets/data/livre_4.yaml
    - assets/data/livre_5.yaml
    - assets/data/99_anomalies.yaml
    - assets/icon/icon.png
    - assets/svgs/

flutter_launcher_icons:
  android: "family_code"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
