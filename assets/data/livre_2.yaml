                  contenu: |-
                    Si les père et mère sont divorcés ou séparés de fait, l’autorité parentale est exercée par celui d’entre eux à qui le tribunal compétent a confié la garde de l’enfant, sauf le droit de visite et de surveillance de l’autre. Lorsque la garde a été confiée à un tiers, les autres attributs de l’autorité parentale continuent d’être exercés par les père et mère. Toutefois, le tribunal, en désignant un tiers comme gardien, peut décider qu’il devra requérir l’ouverture d’une tutelle.
