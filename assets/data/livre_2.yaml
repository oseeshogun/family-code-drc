                          contenu: |-
                            Est puni d’une servitude pénale de sept à trente jours et d’une amende de 50.000 à 250.000 francs congolais ou de l’une de ces peines seulement celui qui, dans une intention coupable ou intéressée, amène ailleurs qu’au siège du conseil de tutelle le plus proche ou aux autorités des villages, un enfant trouvé, abandonné, sans famille. Est puni de la même peine celui qui lui en a donné mission.
