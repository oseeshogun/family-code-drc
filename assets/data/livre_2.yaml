                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Le mineur émancipé par décision judiciaire ne peut passer les actes pour lesquels il est reconnu incapable qu'avec l'assistance d'un curateur. Le curateur est la personne qui avait l'autorité parentale ou tutélaire. A défaut de cette personne, le curateur est désigné conformément aux dispositions de l'article 224.
