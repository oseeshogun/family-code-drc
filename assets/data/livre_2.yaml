estruction.
                  renvois: []
              - numero: "91"
                numero_tri: 91.0
                ordre: 89
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les registres de l’état civil ne peuvent être déplacés dès qu’ils sont mis en service. Ils ne peuvent directement être consultés que par les magistrats chargés de la surveillance des actes de l’état civil, les agents de l’Etat habilités à cet effet et les personnes expressément autorisées par le Procureur de la République ou par le Président du Tribunal de paix dans les communes, secteurs et chefferies. La consultation se fait sans déplacement, sauf quand elle est requise par le procureur de la république ou ordonnée par les tribunaux.
