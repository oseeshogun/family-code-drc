                          Lorsque les circonstances l’exigent, le Gouverneur de province ou le Gouverneur de la ville de Kinshasa, suivant le cas peut, sur proposition du bourgmestre de la commune, du chef du secteur ou de la chefferie, nommer dans un bureau de l’état civil, un agent de l’Etat chargé exclusivement des fonctions d’officier de l’état civil. L’officier de l’état civil ainsi nommé peut être affecté dans un groupement, dans une zone de santé ou dans un hôpital de référence.
