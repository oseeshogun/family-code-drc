                  date_fin_vigueur: null
                  contenu: |-
                    Les actes de l’état civil sont rédigés en français. Outre les dispositions fixées à l’article 84 ci-dessus, ces actes énoncent la date et l’heure auxquelles ils sont dressé, le nom et la qualité de l’officier de l’état-civil ainsi que le nom, sexe,
                    situation matrimoniale, nationalité, profession, domicile ou résidence et, si possible, les date et lieu de naissance de ceux qui sont dénommés. Lorsque la date de naissance doit être mentionnée et que cette date n’est pas connue, l’acte énonce l’âge approximatif de ladite personne.
