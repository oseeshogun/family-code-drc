                  date_fin_vigueur: null
                  contenu: |-
                    Sauf dispositions spéciales prévues par la loi, les actes de l’état civil sont dressés dans le délai de trente jours du fait ou de l’acte juridique qu’ils constatent. Passé le délai légal, l’acte de l’état civil n’a que la valeur probante de simples renseignements. Toutefois, il en sera autrement s’ils sont inscrits au registre en vertu d’un jugement déclaratif ou supplétif.
                  alineas:
