                  contenu: |-
                    L'absence est la situation d'une personne disparue de son domicile ou de sa résidence, sans donner de ses nouvelles et sans avoir constitué un mandataire général.
                    Cette personne est réputée vivante pendant un an à partir des dernières nouvelles positives que l'on a eues de son existence. Si elle a constitué un mandataire général, la présomption de vie lui est acquise pendant trois ans. Le mandataire peut être requis, après six mois à dater des dernières nouvelles, de dresser inventaire et de faire dresser rapport sur l'état des immeubles, à la demande des héritiers présomptifs, des parties intéressées ou à la réquisition du ministère public.
                  alineas:
