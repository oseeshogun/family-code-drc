                  contenu: |-
                    Les déclarations de naissance sont reçues et les actes qui les constatent dressés par l'officier de l'état civil du lieu de la résidence du père ou de la mère. Les déclarations de décès sont reçues et les actes qui les constatent dressés par l'officier de l'état civil du lieu où le décès est survenu. Les actes de mariage ou les enregistrements des mariages célébrés en famille sont établis par l'officier de l'état civil du ressort du lieu de leur célébration. Pour les déclarations autres que celles visées aux alinéas précédents et certaines situations spéciales, la compétence est déterminée par le texte particulier qui les prévoit.
