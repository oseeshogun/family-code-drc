                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Il est interdit à l’officier de l’état civil de recevoir tout acte qui le concerne personnellement ou concerne son conjoint, ses ascendants ou ses descendants. Il ne peut non plus intervenir dans un même acte en cette qualité ou à un autre titre. Dans ce cas, l’acte est reçu par un autre officier de l’état civil visé à l’article 76 ci-dessus.
