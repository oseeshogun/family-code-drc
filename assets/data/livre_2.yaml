              - numero: "101"
                numero_tri: 101.0
                ordre: 99
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Si un ou plusieurs feuillets d’un registre de l’état civil viennent à être perdus ou détruits avant que les parties n’en aient été détachées, l’officier de l’état civil en avise immédiatement le Procureur de la République. Celui-ci mène une enquête sur les motifs de cette disparition ou de cette destruction et prend les mesures opportunes pour la reconstitution du ou des feuillets perdus ou détruits. Si un ou plusieurs feuillets des parties d’un registre conservés au bureau de l’état civil sont perdus ou détruits, ils sont immédiatement reconstitués à l’aide des feuillets correspondants des parties cotées 2 de ces registres, déposés au greffe du Tribunal de grande instance, à l’initiative de l’officier de l’état civil de la commune, du secteur ou de la chefferie. Si un ou plusieurs feuillets des parties d’un registre déposées au greffe du Tribunal de grande instance sont perdus ou détruits, ils sont immédiatement reconstitués à l’aide des feuillets des parties
                    conservées au bureau de l’état civil de la commune, du secteur ou de la chefferie intéressée, à l’initiative du greffier du Tribunal de grande instance du ressort où l’un ou les feuillets ont été perdus ou détruits. Si un ou plusieurs feuillets des parties d’un registre conservées au bureau de l’état civil et ceux des parties déposées au greffe du Tribunal de grande instance sont perdus ou détruits dans ces deux endroits, ils sont immédiatement reconstitués à l’aide des feuillets des parties cotées 3 de ces registres, à l’initiative de l’officier de l’état civil et du greffier du Tribunal de grande instance dans le ressort duquel ces feuillets ont été établis. Si un ou plusieurs feuillets des parties d’un registre déposées au bureau central des actes de l’état civil sont perdus ou détruits, ils sont immédiatement reconstitués à l’initiative du responsable du bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions, à l’aide des feuillets des parties déposées au greffe du Tribunal de grande instance du ressort duquel ce registre a été établi. Dans toutes les hypothèses où un ou des feuillets ont été perdus ou détruits, le dépositaire de ceux-ci est tenu d’avertir, sans délai, le Procureur de la République et d’établir un rapport expliquant les circonstances précises de cette perte ou de cette destruction.
