                      - numero: "263"
                        numero_tri: 263.0
                        ordre: 261
                        version:
                          num_version: 1
                          statut: en_vigueur
                          texte_source: null
                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            Le conseil de tutelle est composé : • • • • • • • •
                            du Bourgmestre, du chef de secteur ou de chefferie, ou de leur représentant, président de droit ; d’un officier du Ministère public ou de son représentant ; de cinq personnes ci-après ou leurs suppléants désignés par le Gouverneur de province ou de la ville de Kinshasa : un délégué de la division provinciale en charge de la famille et de l’enfant ; un délégué de la division provinciale en charge des affaires sociales ; un délégué de la division provinciale en charge de la justice ; un délégué de la confession religieuse la plus représentative du milieu ; un délégué de la Division provinciale de la santé.
                            Le mandat des personnes visées au point 3 de l’alinéa 1er du présent article, dure aussi longtemps qu’il n’y a pas été mis fin par décision de l’autorité qui les a désignées.
                          alineas:
                            - ordre: 1
                              type: alinea
                              contenu: |-
                                  Le conseil de tutelle est composé : • • • • • • • •
                            - ordre: 2
                              type: alinea
                              contenu: |-
                                  du Bourgmestre, du chef de secteur ou de chefferie, ou de leur représentant, président de droit ; d’un officier du Ministère public ou de son représentant ; de cinq personnes ci-après ou leurs suppléants désignés par le Gouverneur de province ou de la ville de Kinshasa : un délégué de la division provinciale en charge de la famille et de l’enfant ; un délégué de la division provinciale en charge des affaires sociales ; un délégué de la division provinciale en charge de la justice ; un délégué de la confession religieuse la plus représentative du milieu ; un délégué de la Division provinciale de la santé.
                            - ordre: 3
                              type: alinea
                              contenu: |-
                                  Le mandat des personnes visées au point 3 de l’alinéa 1er du présent article, dure aussi longtemps qu’il n’y a pas été mis fin par décision de l’autorité qui les a désignées.
