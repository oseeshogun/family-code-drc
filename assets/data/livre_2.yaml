              - numero: "95"
                numero_tri: 95.0
                ordre: 93
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    L’officier de l’état civil donne lecture des actes ou connaissance de leur contenu aux parties comparantes en présence des témoins s’il y en a. Si les parties comparantes ou les témoins, s’il y en a, ne parlent pas la langue française, l’officier de l’état civil traduit d’abord leur déclaration en français et leur donne ensuite une traduction verbale du contenu de l’acte dans une langue qu’ils comprennent. Mention en est faite au bas de l’acte. Si les parties comparantes ou les témoins ne parlent pas la langue française et si l’officier de l’état civil ne connaît pas la langue dans laquelle ils s’expriment, leurs déclarations et le contenu de l’acte sont traduits par un interprète à charge de l’Etat, ayant au préalable prêté le serment suivant devant l’officier de l’état civil: « Je jure de traduire fidèlement les déclarations des parties ou des témoins ainsi que l’acte qui les constate ». Mention est faite, au bas de l’acte, avec indication de la langue dans laquelle la déclaration a été faite, du nom de l’interprète ainsi que de la prestation de serment de celuici.
