                  - numero: "107"
                    numero_tri: 107.0
                    ordre: 105
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Hormis les cas prévus aux articles 105 et 106 ci-dessus, toute rectification des actes de l’état civil est ordonnée par le Tribunal de paix ou par le Tribunal pour enfants, selon le cas, dans le ressort duquel l’acte a été dressé ou transmis. Le tribunal compétent pour ordonner la rectification d’un acte est également compétent pour prescrire la rectification de tous actes même dressés ou transcrits hors de son ressort qui reproduisent l’erreur ou comportent l’omission originelle. La requête en rectification peut être présentée par toute personne intéressée ou par le Ministère public ; celui-ci est tenu d’agir lorsque l’erreur ou l’omission porte sur une indication essentielle de l’acte. Lorsque la requête n’émane pas du Ministère public, elle lui est communiquée. Le dispositif de la décision intervenue est transmis par le Ministère public à l’officier de l’état civil du lieu où se trouve inscrit l’acte à réformer; mention de ce dispositif est aussitôt portée en marge dudit acte. L’expédition ne peut plus être délivrée qu’avec les rectifications ordonnées.
