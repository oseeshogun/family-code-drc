                          contenu: |-
                            La tutelle des pupilles de l’État instituée par la loi est exercée par l’entremise du conseil de tutelle et du tuteur délégué placé sous son contrôle. Les attributions du conseil de tutelle et du tuteur délégué sont respectivement celles du conseil de famille et du tuteur dans le cas d’une tutelle prévue par les dispositions relatives à la capacité, ainsi que par les lois particulières, sauf les dérogations résultant des présentes dispositions organisant la tutelle de l’État.
