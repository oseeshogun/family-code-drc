                          contenu: |-
                            Le conseil de tutelle adresse annuellement un rapport en double exemplaire au Gouverneur de province ou au Gouverneur de la ville de Kinshasa, selon le cas, sur l’ensemble de ses interventions. Un exemplaire du rapport est transmis au ministère qui a la tutelle de l’Etat dans ses attributions. Ce rapport comporte notamment la liste complète des pupilles de l’État avec indication de leur âge, le nom de leur tuteur délégué, l’établissement dans lequel ils sont placés, les résultats obtenus et le montant des frais exposés pour eux.
