          - type: section
            numero: IV
            intitule: "Des registres de l'état civil"
            ordre: 4
            chemin: "2.1.2.4"
            articles:
              - numero: "82"
                numero_tri: 82.0
                ordre: 80
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Toutes les naissances, tous les mariages, tous les décès sont inscrits sous forme d’actes dans un registre de l’état civil distinct, qualifié registre de naissance, de mariage, de décès. Les autres faits ou actes concernant l’état des personnes sont inscrits dans un registre supplétoire et font également l’objet d’une mention éventuelle aux autres registres, sur la base des dispositions spéciales prévues par la loi. Lorsque cette mention ne peut être portée en marge du registre de l’état civil en République Démocratique du Congo, il y a lieu à transcription sur les registres de l’état civil de la commune de la Gombe, ville de Kinshasa.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Toutes les naissances, tous les mariages, tous les décès sont inscrits sous forme d’actes dans un registre de l’état civil distinct, qualifié registre de naissance, de mariage, de décès. Les autres faits ou actes concernant l’état des personnes sont inscrits dans un registre supplétoire et font également l’objet d’une mention éventuelle aux autres registres, sur la base des dispositions spéciales prévues par la loi. Lorsque cette mention ne peut être portée en marge du registre de l’état civil en République Démocratique du Congo, il y a lieu à transcription sur les registres de l’état civil de la commune de la Gombe, ville de Kinshasa.
                  renvois: []
              - numero: "83"
                numero_tri: 83.0
                ordre: 81
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les registres sont clos et arrêtés par l’officier de l’état civil à la fin de chaque année. A la clôture de chaque registre, il est dressé par l’officier de l’état civil une table alphabétique des actes qui y sont contenus, avec indication de leur date et leur numéro de référence. Dans les deux mois suivant la clôture, les parties des feuillets du registre sont réparties conformément à l’article 87 de la présente loi. Il en est de même des tables alphabétiques.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Les registres sont clos et arrêtés par l’officier de l’état civil à la fin de chaque année. A la clôture de chaque registre, il est dressé par l’officier de l’état civil une table alphabétique des actes qui y sont contenus, avec indication de leur date et leur numéro de référence. Dans les deux mois suivant la clôture, les parties des feuillets du registre sont réparties conformément à l’article 87 de la présente loi. Il en est de même des tables alphabétiques.
                  renvois:
                    - article_cible: "87"
                      portee: interne
              - numero: "84"
                numero_tri: 84.0
                ordre: 82
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les registres en blanc mis à la disposition de chaque bureau de l’état civil sont cotés et paraphés du premier au dernier feuillet par l’officier du ministère public dans le ressort duquel se situe le bureau de l’état civil.
                    Les actes sont inscrits de suite sur les registres sans aucun blanc. L’inscription par abréviation est interdite. Les dates sont énoncées en toutes lettres. Les ratures et les renvois sont approuvés et signés de la même manière que dans le corps de l’acte. Les actes sont numérotés en marge du registre au fur et à mesure de leur établissement.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
