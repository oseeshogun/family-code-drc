            divisions:
              - type: paragraphe
                numero: "1"
                intitule: "Des autorités de surveillance et de contrôle"
                ordre: 1
                chemin: "2.1.2.6.1"
                articles:
                  - numero: "102"
                    numero_tri: 102.0
                    ordre: 100
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        La surveillance de l’état civil est assurée par le Président du Tribunal de paix ou le juge de paix qu’il désigne ainsi que par le Procureur de la République ou le magistrat du ministère public qu’il désigne.
                      alineas:
                        - ordre: 1
                          type: alinea
                          contenu: |-
                              La surveillance de l’état civil est assurée par le Président du Tribunal de paix ou le juge de paix qu’il désigne ainsi que par le Procureur de la République ou le magistrat du ministère public qu’il désigne.
                      renvois: []
                  - numero: "103"
                    numero_tri: 103.0
                    ordre: 101
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Une fois par an obligatoirement et chaque fois qu'il l'estime nécessaire, le Président du tribunal de paix ou le juge qu'il délègue à cet effet procède à la vérification des registres de l'état civil de l'année en cours en se transportant dans les différents bureaux de son ressort. Mention de cette inspection et de sa date est faite sur les registres en cours de chaque catégorie d'acte. Elle est inscrite sur la feuille réservée à l'acte suivant immédiatement le dernier acte inscrit. Cette mention doit comporter une appréciation générale de la tenue des registres. Elle est suivie de la signature et du sceau du tribunal de paix. Les parties de la feuille non consacrées à la mention sont bâtonnées. L'inspection terminée, le Président du tribunal de paix ou son délégué adresse à l'officier de l'état civil ses observations sur les contraventions relevées en visant les articles de la loi violée. Il indique, s'il y a lieu, les moyens qu'il juge propres à éviter que de telles erreurs se reproduisent. Copie de ce rapport est envoyée sans délai au Procureur de la République.
