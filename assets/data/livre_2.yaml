                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    L’émancipation confère au mineur la pleine capacité. Toutefois, lorsque l'émancipation est accordée par une décision judiciaire, le tribunal peut apporter certaines limitations à la capacité.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
