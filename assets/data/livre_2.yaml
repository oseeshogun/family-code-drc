                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        A la demande du conseil, l'Etat supporte les frais d'entretien et d'éducation des enfants dont la tutelle lui est déférée dans la mesure où les revenus de ceux-ci ne leur permettent pas d'y faire face. Les revenus des biens et capitaux appartenant au pupille, à l'exception de ceux provenant de son travail et de ses économies, peuvent être perçus au profit de l'Etat à titre d'indemnité de frais d'entretien. Toutefois, au moment de la reddition des comptes, le conseil de tutelle peut faire à cet égard toute remise qu'il jugera équitable.
                      alineas:
                        - ordre: 1
                          type: alinea
                          contenu: |-
                              A la demande du conseil, l'Etat supporte les frais d'entretien et d'éducation des enfants dont la tutelle lui est déférée dans la mesure où les revenus de ceux-ci ne leur permettent pas d'y faire face. Les revenus des biens et capitaux appartenant au pupille, à l'exception de ceux provenant de son travail et de ses économies, peuvent être perçus au profit de l'Etat à titre d'indemnité de frais d'entretien. Toutefois, au moment de la reddition des comptes, le conseil de tutelle peut faire à cet égard toute remise qu'il jugera équitable.
