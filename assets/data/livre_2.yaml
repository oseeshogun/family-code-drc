              - numero: "322"
                numero_tri: 322.0
                ordre: 320
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Si le père ou la mère décède ou se trouve dans un des cas énumérés à l’article 318 ci-dessus, l’autorité parentale est exercée comme prévu à l’article 198 de la présente loi. Lorsque la filiation du mineur n’est établie qu’à l’égard d’un de ses parents, l’exercice de l’autorité parentale est dévolu à celui-ci.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
