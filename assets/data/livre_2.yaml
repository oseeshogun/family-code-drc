                          portee: interne
                  - numero: "155"
                    numero_tri: 155.0
                    ordre: 153
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Tout acte de notoriété doit être homologué, à la requête de la partie qui le demande, par le Président du Tribunal de paix ou celui de Tribunal pour enfants où cet acte a été établi. Avant l’homologation, l’acte de notoriété n’a de valeur que celle d’un simple renseignement. Le Président du tribunal concerné peut, avant l’homologation, demander à l’officier de l’état civil un complément d’information, requérir ou prescrire toute vérification qu’il estime nécessaire. En cas de refus, le Président du tribunal concerné motive sa décision; celle-ci est susceptible d’appel devant le Tribunal de grande instance. Après homologation, l’acte de notoriété est assimilé à tous égards à un acte de l’état civil.
