                      contenu: |-
                        Le père et la mère ainsi que les autres débiteurs d'aliments du pupille de l'Etat restent tenus envers lui de l'obligation alimentaire. Dans ce cas, les allocations familiales ne sont pas versées aux père et mère mais au tuteur délégué, à la personne ou à l'établissement qui a la garde du pupille. Dans la mesure où il supporte les frais d'entretien et d'éducation du pupille, l'Etat est subrogé dans les droits du pupille envers les débiteurs d'aliments.
