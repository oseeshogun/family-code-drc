        divisions:
          - type: section
            numero: I
            intitule: "De l'attribution de l'autorité parentale"
            ordre: 1
            chemin: "2.2.4.1"
            articles:
              - numero: "316"
                numero_tri: 316.0
                ordre: 314
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    L'enfant, à tout âge, doit honneur et respect à ses père et mère.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          L'enfant, à tout âge, doit honneur et respect à ses père et mère.
                  renvois: []
              - numero: "317"
                numero_tri: 317.0
                ordre: 315
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    L'enfant mineur reste, jusqu'à sa majorité ou à son émancipation, sous l'autorité conjointe de ses père et mère quant à l'administration de sa personne et de son patrimoine et quant à la protection de sa sécurité, de sa santé et de sa moralité. En cas de dissentiment entre le père et la mère, la volonté du père prévaut. Toutefois, la mère a droit de recours devant le tribunal de paix.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          L'enfant mineur reste, jusqu'à sa majorité ou à son émancipation, sous l'autorité conjointe de ses père et mère quant à l'administration de sa personne et de son patrimoine et quant à la protection de sa sécurité, de sa santé et de sa moralité. En cas de dissentiment entre le père et la mère, la volonté du père prévaut. Toutefois, la mère a droit de recours devant le tribunal de paix.
                  renvois: []
              - numero: "318"
                numero_tri: 318.0
                ordre: 316
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Perd l'exercice de l'autorité parentale ou en est provisoirement privé celui des père et mère qui se trouve dans l'un des cas suivants:
                    1. Si un jugement de déchéance ou de retrait a été prononcé contre lui, pour ceux de ses droits qui lui ont été retirés;
                    2. S'il est hors d'état de manifester sa volonté en raison de son incapacité, de son absence, de sa disparition, de son éloignement ou de toute autre cause.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Perd l'exercice de l'autorité parentale ou en est provisoirement privé celui des père et mère qui se trouve dans l'un des cas suivants:
                    - ordre: 2
                      type: point
                      contenu: |-
                          1. Si un jugement de déchéance ou de retrait a été prononcé contre lui, pour ceux de ses droits qui lui ont été retirés;
                    - ordre: 3
                      type: point
                      contenu: |-
                          2. S'il est hors d'état de manifester sa volonté en raison de son incapacité, de son absence, de sa disparition, de son éloignement ou de toute autre cause.
                  renvois: []
              - numero: "319"
                numero_tri: 319.0
                ordre: 317
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Le père, la mère ou toute autre personne exerçant l’autorité parentale peut être déchu de celle-ci, en tout ou en partie, à l’égard de tous ses enfants, de l’un ou de plusieurs d’entre eux :
                    1.lorsqu’il est condamné pour incitation à la débauche de ses propres enfants, de ses descendants et de tout autre mineur ;
                    2.lorsqu’il est condamné du chef de tous faits commis sur la personne d’un de ses enfants ou de ses descendants ;
                    3.lorsque, par mauvais traitement, abus d’autorité, inconduite notoire ou négligence grave, il met en péril la santé, la sécurité ou la moralité de son enfant;
                    4.lorsqu’il a été condamné pour abandon de famille. La déchéance est prononcée par le Tribunal pour enfants sur réquisition du Ministère public. Le Tribunal pour enfants peut, dans les mêmes conditions, relever de la déchéance en tout ou en partie.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Le père, la mère ou toute autre personne exerçant l’autorité parentale peut être déchu de celle-ci, en tout ou en partie, à l’égard de tous ses enfants, de l’un ou de plusieurs d’entre eux :
                    - ordre: 2
                      type: point
                      contenu: |-
                          1.lorsqu’il est condamné pour incitation à la débauche de ses propres enfants, de ses descendants et de tout autre mineur ;
                    - ordre: 3
                      type: point
                      contenu: |-
                          2.lorsqu’il est condamné du chef de tous faits commis sur la personne d’un de ses enfants ou de ses descendants ;
                    - ordre: 4
                      type: point
                      contenu: |-
                          3.lorsque, par mauvais traitement, abus d’autorité, inconduite notoire ou négligence grave, il met en péril la santé, la sécurité ou la moralité de son enfant;
                    - ordre: 5
                      type: point
                      contenu: |-
                          4.lorsqu’il a été condamné pour abandon de famille. La déchéance est prononcée par le Tribunal pour enfants sur réquisition du Ministère public. Le Tribunal pour enfants peut, dans les mêmes conditions, relever de la déchéance en tout ou en partie.
                  renvois: []
