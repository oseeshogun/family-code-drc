                  - numero: "106"
                    numero_tri: 106.0
                    ordre: 104
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Le défaut d’acte de l’état civil peut être suppléé par jugement rendu par le Tribunal de paix ou par le Tribunal pour enfants, selon le cas, sur simple requête présentée au tribunal du lieu où l’acte aurait dû être dressé. L’initiative de l’action appartient à toute personne intéressée et au Ministère public. Lorsque celle-ci n’émane pas du Ministère public, la requête lui est communiquée. Lorsque le défaut d’un acte de l’état civil est constaté par l’officier de l’état civil au motif que les déclarants se sont présentés après l’expiration du délai légal, l’officier de l’état civil, après avoir vérifié la réalité des déclarations à faire et les motifs du retard, envoie, sans délai, un rapport au Ministère public qui saisit le tribunal. Le tribunal, après vérification et enquête éventuelle, statue par décision motivée. La transcription sur le registre de l’état civil du dispositif du jugement est faite par l’officier de l’état civil du lieu où s’est produit le fait, dans les huit jours de la réception de ce dispositif fait à l’initiative du Ministère public. Elle en est effectuée sur les registres de l’année en cours et mention en est portée en marge des registres, à la date du fait. L’officier de l’état civil, dans le cas où cette transcription intéresse un fait d’une année antérieure à l’année en cours, après vérification ou enquête, avertit, dans les huit jours, le greffier du Tribunal de grande instance et le bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions de la mention à faire en marge des registres, à la date des faits.
