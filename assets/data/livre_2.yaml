              - numero: "99"
                numero_tri: 99.0
                ordre: 97
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Sauf dispositions spéciales prévues aux règles propres à chacun des actes de l’état civil, toute personne peut, moyennant paiement des frais, se faire délivrer des copies des actes qui sont inscrits aux registres de l’état civil. Ces copies délivrées, certifiées conformes au registre, portent la date de leur délivrance, énoncée en toutes lettres, et sont revêtues du sceau de l’autorité qui les a délivrées. Elles sont, en outre, légalisées lorsqu’il y a lieu de les produire devant les autorités étrangères. Il peut être délivré de simples extraits qui contiennent le nom de la commune, du secteur ou de la chefferie où l’acte a été dressé, la date de son établissement, la nature précise de l’acte et les mentions éventuelles, le nom, le sexe de celui ou de ceux qui le concernent. Ils sont signés par l’autorité qui les délivre et sont revêtus de son sceau. En cas de délivrance d’actes de l’état civil requis pour des besoins administratifs, la délivrance se fait uniquement par extrait et sans frais. Lorsque l’officier de l’état civil constate que l’acte de l’état civil n’a pas été inscrit, il établit un certificat négatif. Les copies et extraits d’actes de l’état civil ainsi que les certificats négatifs font foi jusqu’à l’inscription en faux.
