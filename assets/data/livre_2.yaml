                  contenu: |-
                    Lorsque les facultés mentales d'un majeur ou d'un mineur émancipé sont durablement altérées par une maladie, une infirmité ou un affaiblissement dû à l'âge, il est pourvu à ses intérêts par l'un des régimes de protection prévus au présent chapitre. Les mêmes régimes de protection sont applicables à l'altération durable des facultés corporelles, si elle est susceptible d'empêcher l'expression de la volonté. L'altération des facultés mentales ou corporelles doit être constatée par le juge après expertise médicale.
                  alineas:
