                      - numero: "261"
                        numero_tri: 261.0
                        ordre: 259
                        version:
                          num_version: 1
                          statut: en_vigueur
                          texte_source: null
                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            La personne morale désignée comme tuteur délégué et les membres de sa direction sont tenus personnellement et solidairement de tout dommage résultant d'une faute dans l'exercice de la tutelle. Un membre de la direction pourra toutefois se libérer de sa responsabilité en démontrant que le dommage n'est pas dû à sa faute personnelle. Lorsque la direction de la personne morale a autorisé un de ses membres à exercer la tutelle, conformément à l'article 250, il est présumé que le dommage résulte exclusivement de la faute du membre autorisé.
