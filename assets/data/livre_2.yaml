                  contenu: |-
                    Les actes accomplis irrégulièrement par le mineur non émancipé ou par le mineur émancipé sont nuls de nullité relative.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Les actes accomplis irrégulièrement par le mineur non émancipé ou par le mineur émancipé sont nuls de nullité relative.
