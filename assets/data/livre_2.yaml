                  contenu: |-
                    Sauf les dispositions finales prévues en matière de mariage, les officiers de l'état civil ne peuvent rien insérer dans les actes qu'ils reçoivent, soit par note ou énonciation quelconque, que ce qui doit être déclaré par les comparants. Si une déclaration leur semble contraire à la loi, ils doivent en aviser le Procureur de la République qui agit, s'il y a lieu, en rectification d'état ou en action d'état.
