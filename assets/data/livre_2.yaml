                  contenu: |-
                    La perte de l'exercice de l'autorité parentale n'exonère pas son titulaire de ses obligations pécuniaires qui découlent de l'entretien et de l'éducation de ses enfants.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
