                          date_fin_vigueur: null
                          contenu: |-
                            Le président du conseil de tutelle désigne un secrétaire choisi parmi les agents de l’administration. Celui-ci est chargé de la rédaction des procès-verbaux des réunions. Les procès-verbaux et les autres archives du conseil de tutelle sont conservés, selon le cas, au bureau de la commune, du secteur ou de la chefferie.
                          alineas:
                            - ordre: 1
                              type: alinea
                              contenu: |-
                                  Le président du conseil de tutelle désigne un secrétaire choisi parmi les agents de l’administration. Celui-ci est chargé de la rédaction des procès-verbaux des réunions. Les procès-verbaux et les autres archives du conseil de tutelle sont conservés, selon le cas, au bureau de la commune, du secteur ou de la chefferie.
