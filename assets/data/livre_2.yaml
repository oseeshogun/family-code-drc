                      date_fin_vigueur: null
                      contenu: |-
                        Le Ministre, qui a la tutelle de l'Etat dans ses attributions, détermine le montant des subsides alloués pour l'entretien et l'éducation des enfants placés dans les établissements officiels ou privés ou chez des particuliers. Ces subsides ne peuvent être utilisés qu'au profit de l'enfant pour lequel ils sont alloués.
