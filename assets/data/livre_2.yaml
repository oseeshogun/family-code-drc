                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            Le tuteur délégué est responsable de sa gestion. Il en est comptable envers le conseil, même durant la tutelle. Il dresse avec le conseil, en entrant en fonction, l'inventaire des biens du mineur dont la gestion lui est confiée. Cet inventaire reste déposé au siège du conseil jusqu'à la fin de la tutelle. Si l'état des biens du mineur confiés au tuteur délégué vient à se modifier au cours de la tutelle, des inventaires complémentaires doivent être annexés au premier. Le compte complet de gestion doit être dressé par le tuteur délégué à sa sortie de fonction ou par ses héritiers s'il meurt en fonction. Ce compte est approuvé par le conseil. Le tuteur délégué ou ses héritiers ont trois mois pour dresser le compte. L'approbation qui est donnée par le conseil ne devient définitive que six mois après la reddition du compte.
