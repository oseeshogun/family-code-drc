              - numero: "323"
                numero_tri: 323.0
                ordre: 321
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    En cas de décès de l’un des parents exerçant l’autorité parentale, le Tribunal pour enfants peut, à tout moment, à la requête soit du représentant du conseil de famille du parent prédécédé, soit du parent survivant, désigner un tuteur adjoint chargé d’assister le parent survivant dans l’éducation, l’entretien et la gestion des biens du mineur. Après que le parent survivant a été entendu sur l’opportunité et les modalités de cette mesure, le tribunal fixe les charges et contrôles auxquels le tuteur adjoint sera appelé à participer. Si le tuteur adjoint est tenu de participer aux obligations d’entretien et d’éducation du mineur, il bénéficie des avantages fixés par la législation sociale en faveur du tuteur.
                  alineas:
