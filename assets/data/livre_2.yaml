                          date_fin_vigueur: null
                          contenu: |-
                            Le conseil se réunit sur convocation de son président au moins une fois par trimestre. Il ne peut prendre de décision que si le président et deux membres ou suppléants sont présents. Les décisions sont prises à la majorité des voix. En cas de partage, la voix du président est prépondérante.
