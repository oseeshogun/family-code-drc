                  contenu: |-
                    L’enfant porte dans l’acte de naissance le nom choisi par ses parents. Si le père de l’enfant n’est pas connu ou lorsque l’enfant a été désavoué, l’enfant porte le nom choisi par la mère. Lorsque la filiation paternelle est établie après la filiation maternelle, le père pourra adjoindre un élément du nom choisi par lui. Si l’enfant a plus de quinze ans, son consentement personnel est nécessaire.
                  alineas:
