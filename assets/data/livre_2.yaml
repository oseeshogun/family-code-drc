                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            Sauf dérogation expresse de la loi, le conseil de tutelle exerce, par rapport au pupille de l'Etat, toutes les compétences attribuées par les dispositions relatives à la capacité ainsi que par des lois particulières aux conseils de famille et aux réunions familiales par rapport au mineur. Le conseil de tutelle dispose de tous les pouvoirs qui lui permettent d'exercer la tutelle au mieux des intérêts du mineur.
                          alineas:
