                  contenu: |-
                    Lorsqu’un enfant est né pendant un voyage maritime, fluvial, lacustre ou aérien, sur un navire, bateau ou aéronef battant pavillon congolais, il est dressé acte, dans les quarante-huit heures de l’accouchement, sur déclaration de la mère ou du père s’il est à bord. À défaut du père, et si la mère est dans l’impossibilité de déclarer la naissance, l’acte est établi d’office par le commandant ou par la personne qui en remplit les fonctions. Au premier port congolais où le navire ou le bateau aborde pour son désarmement, l’officier instrumentaire est tenu d’envoyer pour transcription sur les registres de naissance deux copies de l’acte constatant la naissance dressé à bord : •
                    l’une au bureau de l’inscription maritime, fluviale ou lacustre ;
                    •
                    et l’autre à l’officier de l’état civil de la dernière résidence du père ou de la mère de l’enfant.
                    Si la dernière résidence ne peut être trouvée ou si elle est hors de la République, la transcription est faite au bureau de l’état civil le plus proche du lieu de naissance qui le transmet au bureau central de l’état civil. En cas de naissance à bord d’un aéronef battant pavillon congolais, l’officier instrumentaire est tenu d’envoyer pour transcription sur les registres de naissance deux copies de l’acte constatant la naissance dressé à bord : •
                    l’une à l’officier de l’état civil de la commune, du secteur ou de la chefferie de l’aéroport d’arrivée ;
                    •
                    et l’autre à l’officier de l’état civil de la dernière résidence du père ou de la mère.
