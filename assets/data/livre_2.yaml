              - numero: "100"
                numero_tri: 100.0
                ordre: 98
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Dans tous les cas où la mention d’un acte relatif à l’état civil doit avoir lieu en marge, elle est faite par l’officier de l’état civil sur les registres courants de l’année sur toutes ses parties et, dans le cas contraire, sur la partie cotée 4 conservée aux archives du bureau de l’état civil de la commune, du secteur ou de la chefferie. Dans ce dernier cas, l’officier de l’état civil avertit, dans les huit jours, le greffier du Tribunal de grande instance ainsi que le chef du bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions, en envoyant copie conforme de la mention. Le greffier du Tribunal de grande instance ou le chef du bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions veille à ce que la mention soit faite de la même manière sur la partie qui lui a été envoyée pour dépôt.
                  alineas:
