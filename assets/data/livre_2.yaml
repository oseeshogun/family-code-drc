                numero_tri: 320.0
                ordre: 318
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les père et mère de l'enfant, à l'exclusion du tuteur, peuvent déléguer, en tout ou en partie, l'exercice de l'autorité parentale à une personne majeure jouissant de la pleine capacité civile. La délégation est soumise aux conditions de fond et de forme du droit commun.
                  alineas:
