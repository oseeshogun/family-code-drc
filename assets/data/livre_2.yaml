                      contenu: |-
                        Le conjoint survivant peut, s'il opte pour le maintien du régime matrimonial, empêcher l'envoi provisoire et l'exercice de tous les droits subordonnés à la condition du décès de l'absent. Si le conjoint survivant demande la dissolution provisoire du régime matrimonial, il exerce ses reprises et tous les droits légaux. Dans l'un ou l'autre cas, il doit donner caution et cautionnement. La femme, optant pour la continuation provisoire d'un des deux régimes de communauté, conserve le droit d'y renoncer.
