                    Lorsque le corps d'une personne décédée est trouvé, il est fait appel à l'officier de police judiciaire qui dresse un procès-verbal en vue de mener une enquête. Il est dressé ensuite un acte de décès par l'officier de l'état civil du lieu où le corps a été trouvé. Si l'identité de la personne décédée n'est pas connue, il est dressé un procès-verbal détaillé qui énonce les jour, mois, année et lieu où le corps a été trouvé, l'âge apparent du mort, son sexe et la date probable du décès. Ce procès verbal est annexé à l'acte de décès. Si l'identité de la personne décédée vient à être connue, le procès-verbal de la découverte et l'acte provisoire de décès sont annulés par le tribunal de grande instance à la requête du ministère public ou de toute personne intéressée.
