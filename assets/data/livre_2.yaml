                  date_fin_vigueur: null
                  contenu: |-
                    L’action en nullité ne peut être poursuivie que par le mineur ou selon le cas par ses père et mère, son tuteur, son curateur ou par les héritiers du mineur, au cas où l'acte aurait causé préjudice au mineur. L’acte peut être confirmé. L’action en nullité se prescrit par dix ans à dater de la majorité du mineur.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          L’action en nullité ne peut être poursuivie que par le mineur ou selon le cas par ses père et mère, son tuteur, son curateur ou par les héritiers du mineur, au cas où l'acte aurait causé préjudice au mineur. L’acte peut être confirmé. L’action en nullité se prescrit par dix ans à dater de la majorité du mineur.
