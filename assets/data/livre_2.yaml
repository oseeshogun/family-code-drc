                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Lors de la célébration ou de l’enregistrement du mariage, l’officier de l’état civil remet aux conjoints un livret de ménage portant, sur la première page, leur identité, la date et le lieu de l’enregistrement du mariage célébré en famille ou de la célébration devant l’officier de l’état civil, les énonciations relatives à la dot et celles relatives au régime matrimonial. Les énonciations qui précèdent sont signées par l’officier de l’état civil et par les conjoints ou si ceuxci ou l’un de ceux-ci ne savent pas signer, ils apposent leur empreinte digitale au lieu de la signature ou bien mention est faite de la cause qui les a ou l’a empêché de signer. Sur les pages suivantes sont inscrits les naissances et décès des enfants, les adoptions, les actes d’affiliation des enfants nés hors mariage, les décès ou le divorce des époux ainsi que l’identité des parents intégrés au ménage. Au cas où un acte de l’état civil est rectifié ou que l’un des parents intégrés au ménage doit le quitter, il est fait mention sur le livret de ménage. Les inscriptions et les mentions portées dans le livret sont signées par l’officier de l’état civil et revêtues de son sceau.
