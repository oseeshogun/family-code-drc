                    Il n’est pas permis de changer de nom en tout ou en partie ou d’en modifier l’orthographe ni l’ordre des éléments tel qu’il a été déclaré à l’état civil. Le changement ou la modification peut toutefois être autorisé, selon le cas, par le tribunal de paix ou par le tribunal pour enfants du ressort de la résidence du demandeur pour juste motif et en conformité avec les dispositions de l’article 58 de la présente loi. Le jugement est rendu sur requête soit de l’intéressé, s’il est majeur, soit du père, de la mère de l’enfant ou d’une personne appartenant à la famille paternelle ou maternelle, selon le cas, si l’intéressé est mineur.
