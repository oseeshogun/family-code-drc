                  renvois: []
              - numero: "85"
                numero_tri: 85.0
                ordre: 83
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les registres commencent par une première page où sont indiqués les noms des officiers de l’état civil et leurs qualifications avec, en regard de cette indication, la signature de ceux-ci. Ils comportent ensuite une série de feuillets numérotés dont chacun sert à la rédaction des actes de l’état civil. Les modèles des feuillets de chaque registre de l’état civil sont fixés par arrêté du ministre ayant la justice dans ses attributions. Les registres se terminent par plusieurs pages destinées à contenir la table alphabétique des personnes auxquelles se rapportent les actes des registres.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Les registres commencent par une première page où sont indiqués les noms des officiers de l’état civil et leurs qualifications avec, en regard de cette indication, la signature de ceux-ci. Ils comportent ensuite une série de feuillets numérotés dont chacun sert à la rédaction des actes de l’état civil. Les modèles des feuillets de chaque registre de l’état civil sont fixés par arrêté du ministre ayant la justice dans ses attributions. Les registres se terminent par plusieurs pages destinées à contenir la table alphabétique des personnes auxquelles se rapportent les actes des registres.
                  renvois: []
              - numero: "86"
                numero_tri: 86.0
                ordre: 84
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les feuillets des registres de l’état civil sont composés de quatre parties égales portant des mentions identiques. Une marge égale au tiers de chaque partie est réservée pour d’éventuelles mentions.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Les feuillets des registres de l’état civil sont composés de quatre parties égales portant des mentions identiques. Une marge égale au tiers de chaque partie est réservée pour d’éventuelles mentions.
                  renvois: []
              - numero: "87"
                numero_tri: 87.0
                ordre: 85
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    La partie cotée 1, extérieure à la souche et supérieure du registre, est remise immédiatement au déclarant. La partie cotée 2, extérieure à la souche et inférieure du registre, est détachée du registre à la fin de l’année. Réunie en une liasse, elle est envoyée dans les deux mois pour dépôt au greffe du Tribunal de grande instance du ressort. Cette liasse, dès sa réception, est reliée par les soins du greffe qui en est le dépositaire. La partie cotée 3, attachée à la souche et inférieure du registre, est séparée à la fin de l’année de la partie 4 de la souche supérieure. Elle est envoyée dans les deux mois au bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions. La partie cotée 4 est conservée au bureau de l’état civil du lieu où ce registre a été tenu. Les tables alphabétiques sont détachées en deux exemplaires à la fin de l’année, enliassées et envoyées, dans les deux mois, l’une au greffe du Tribunal de grande instance du ressort et l’autre au bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions. L’original des tables alphabétiques reste dans le registre conservé au bureau de l’état civil. Les parties cotées 2 et 3 des registres de l’état civil ainsi que les tables alphabétiques établies par les agents diplomatiques et consulaires sont envoyées dans les deux mois après la fin de l’année, respectivement au greffe du Tribunal de grande instance de la Gombe et au bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          La partie cotée 1, extérieure à la souche et supérieure du registre, est remise immédiatement au déclarant. La partie cotée 2, extérieure à la souche et inférieure du registre, est détachée du registre à la fin de l’année. Réunie en une liasse, elle est envoyée dans les deux mois pour dépôt au greffe du Tribunal de grande instance du ressort. Cette liasse, dès sa réception, est reliée par les soins du greffe qui en est le dépositaire. La partie cotée 3, attachée à la souche et inférieure du registre, est séparée à la fin de l’année de la partie 4 de la souche supérieure. Elle est envoyée dans les deux mois au bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions. La partie cotée 4 est conservée au bureau de l’état civil du lieu où ce registre a été tenu. Les tables alphabétiques sont détachées en deux exemplaires à la fin de l’année, enliassées et envoyées, dans les deux mois, l’une au greffe du Tribunal de grande instance du ressort et l’autre au bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions. L’original des tables alphabétiques reste dans le registre conservé au bureau de l’état civil. Les parties cotées 2 et 3 des registres de l’état civil ainsi que les tables alphabétiques établies par les agents diplomatiques et consulaires sont envoyées dans les deux mois après la fin de l’année, respectivement au greffe du Tribunal de grande instance de la Gombe et au bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions.
                  renvois: []
              - numero: "88"
                numero_tri: 88.0
                ordre: 86
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les procurations et autres pièces qui doivent demeurer annexées aux actes de l'état civil sont cotées par référence à l'acte qu'elles concernent, paraphées par la personne qui les a produites et par l'officier de l'état civil, classées chronologiquement par nature et date de l'acte et en fin d'année enliassées pour être transmises en original dans les deux mois au greffe du tribunal de grande instance en même temps que la partie cotée 2.
                    Les copies certifiées conformes de ces documents demeurent au bureau de l'état civil du lieu où les actes ont été établis.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Les procurations et autres pièces qui doivent demeurer annexées aux actes de l'état civil sont cotées par référence à l'acte qu'elles concernent, paraphées par la personne qui les a produites et par l'officier de l'état civil, classées chronologiquement par nature et date de l'acte et en fin d'année enliassées pour être transmises en original dans les deux mois au greffe du tribunal de grande instance en même temps que la partie cotée 2.
                    - ordre: 2
                      type: alinea
                      contenu: |-
                          Les copies certifiées conformes de ces documents demeurent au bureau de l'état civil du lieu où les actes ont été établis.
                  renvois: []
              - numero: "89"
                numero_tri: 89.0
                ordre: 87
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Lorsqu'un feuillet d'un registre de l'état civil n'a pas été utilisé par erreur ou a été mal utilisé, l'officier de l’état civil l'annule en traçant sur chacune de ses parties une ligne diagonale de haut en bas et en écrivant sur chacune des parties «annulé pour erreur».
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Lorsqu'un feuillet d'un registre de l'état civil n'a pas été utilisé par erreur ou a été mal utilisé, l'officier de l’état civil l'annule en traçant sur chacune de ses parties une ligne diagonale de haut en bas et en écrivant sur chacune des parties «annulé pour erreur».
                  renvois: []
              - numero: "90"
                numero_tri: 90.0
                ordre: 88
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Si un registre conservé au bureau de l’état civil est perdu ou détruit, il est immédiatement reconstitué à l’aide des parties cotées 2 de ce registre déposées au greffe du Tribunal de grande instance, à l’initiative de l’officier de l’état civil de la commune, du secteur ou de la chefferie. Si les parties cotées 2 d’un registre sont perdues ou détruites, elles sont immédiatement reconstituées à l’aide des parties conservées au bureau de l’état civil de la commune, du secteur ou de la chefferie intéressée, à l’initiative du greffier du Tribunal de grande instance du ressort où les parties ont été perdues ou détruites. Si les parties des registres conservées dans un bureau de l’état civil et celles déposées au greffe du Tribunal de grande instance sont perdues ou détruites dans ces deux endroits, elles sont immédiatement reconstituées à l’aide des parties cotées 3 de ce registre, à l’initiative de l’officier de l’état civil et du greffier du Tribunal de grande instance dans le ressort duquel ces registres ont été établis. Si les parties cotées 3 d’un registre sont perdues ou détruites, elles sont immédiatement reconstituées à l’initiative du responsable du bureau central des actes de l’état civil du ministère ayant la justice dans ses attributions, à l’aide des parties conservées au greffe du Tribunal de grande instance, dans le ressort duquel ce registre a été établi. Si un registre vient à être détruit ou perdu avant que les parties n’en aient été détachées, l’officier de l’état civil en avise immédiatement le Procureur de la République. Celui-ci mène une enquête sur les motifs de cette destruction ou de cette disparition et prend les mesures opportunes pour la reconstitution du registre. Dans toutes les hypothèses où un ou des registres ont été perdus ou détruits, le dépositaire de ceux-ci est tenu d’avertir, sans délai, le Procureur de la République et d’établir un rapport expliquant les circonstances précises de cette perte ou de cette destruction.
