                          date_fin_vigueur: null
                          contenu: |-
                            Les biens, revenus ou salaires du mineur qui ne sont pas confiés au tuteur délégué sont gérés par le conseil de tutelle. Les dispositions de l’article 229 de la présente loi ne s’appliquent pas. Le Gouverneur de province ou celui de la ville de Kinshasa impose, le cas échéant, aux conseils de tutelle et aux tuteurs délégués la gestion des biens des pupilles de l’État.
                          alineas:
