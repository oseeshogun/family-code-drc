                    Les père et mère ou celui qui exerce l'autorité parentale sont chargés de la direction de l'enfant mineur. Ils ne peuvent faire usage des droits de l'autorité parentale que dans l'intérêt de l'enfant. Celui qui exerce l'autorité parentale est tenu d'entretenir l'enfant et de pourvoir à ses besoins et à son éducation dans la mesure de ses moyens.
                    Il a le droit et le devoir de fixer la résidence de l'enfant, de surveiller ses actes et ses relations, de régler sa sépulture et de faire respecter sa mémoire. Il peut infliger à l'enfant réprimandes et corrections dans la mesure compatible avec son âge et l'amendement de sa conduite.
