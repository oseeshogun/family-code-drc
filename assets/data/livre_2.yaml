                      date_fin_vigueur: null
                      contenu: |-
                        La possession provisoire n'est qu'un dépôt; les envoyés ont les mêmes droits et les mêmes devoirs que l'administrateur nommé par le tribunal pendant que la vie est encore présumée. Toutefois, ils ne sont pas tenus de bonifier les fruits consommés à l'absent qui reparaîtrait et ne lui doivent compte que du capital et des fruits encore existants.
                      alineas:
