              texte_source: null
              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                Le conjoint survivant a l'usufruit de la maison habitée par les époux et des meubles meublants. Il a en outre droit à la moitié de l'usufruit des terres attenantes que l'occupant de la maison exploitait personnellement pour son propre compte ainsi que du fonds de commerce y afférent, l'autre moitié revenant aux héritiers de la première catégorie. En cas de mise en location de la maison habitée par les époux, le fruit de celle-ci est partagé en deux parties égales entre le conjoint survivant et les héritiers de la première catégorie. L'usufruit du conjoint survivant cesse par le convol de ce dernier ou sa méconduite dans la maison conjugale, s'il existe des héritiers de la première ou de la deuxième catégorie.
              alineas:
