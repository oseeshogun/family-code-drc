              date_fin_vigueur: null
              contenu: |-
                Le testament authentique est celui établi par le testateur soit devant le notaire soit devant l'officier de l'état civil de son domicile ou de sa résidence. Si un testament authentique est établi devant l'officier de l'état civil, celui-ci garde dans ses archives un des deux originaux et inscrit en outre dans un registre spécial des testaments, la date à laquelle celui-ci a été établi ainsi que les noms et le domicile ou la résidence du de cujus. Ce registre peut être consulté après le décès du testateur par toute personne qui le demande et qui pourra prendre connaissance sur place de l'original.
