                  date_fin_vigueur: null
                  contenu: |-
                    L'acceptation est expresse de la part de l'héritier lorsqu'il prend acte de sa qualité d'héritier. L'acceptation est tacite lorsque l'héritier accomplit un acte qui manifeste de façon non équivoque son intention d'accepter ou lorsque, après le délai pour renoncer, l'héritier ne l'a pas fait.
                  alineas:
