          - numero: "783"
            numero_tri: 783.0
            ordre: 786
            version:
              num_version: 1
              statut: en_vigueur
              texte_source: null
              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                Lorsqu’en faveur d’un quelconque héritier ab intestat ou testamentaire, venant à la succession, le de cujus a fait des donations entre vifs, celles-ci seront imputées pour le calcul de sa quote-part successorale et éventuellement réduites par retour à la masse successorale de ce qui dépasse la portion que la loi lui permet d’avoir. Toutefois, les donations accordées aux héritiers de la première catégorie seront réputées avoir été faites à titre de legs et ne seront réduites après retour à la masse successorale, que dans la mesure où elles dépassent la part de l’hérédité disponible qui leur a été de la sorte dévolue, soit à titre de seuls bénéficiaires soit en concours avec d’autres légataires. La preuve de ces donations entre vifs incombe à celui des héritiers ab intestat ou à celui des légataires qui l’invoque. Toutefois, ne sont pas pris en considération les dons manuels ne dépassant pas le montant de 125.000 francs congolais pour autant que ceux-ci totalisés ne dépassent pas 620.000 francs congolais. Dans tous les cas de réduction, celle-ci se répartira en proportion de la part successorale initiale attribuée à chaque héritier.
              alineas:
                - ordre: 1
                  type: alinea
                  contenu: |-
                      Lorsqu’en faveur d’un quelconque héritier ab intestat ou testamentaire, venant à la succession, le de cujus a fait des donations entre vifs, celles-ci seront imputées pour le calcul de sa quote-part successorale et éventuellement réduites par retour à la masse successorale de ce qui dépasse la portion que la loi lui permet d’avoir. Toutefois, les donations accordées aux héritiers de la première catégorie seront réputées avoir été faites à titre de legs et ne seront réduites après retour à la masse successorale, que dans la mesure où elles dépassent la part de l’hérédité disponible qui leur a été de la sorte dévolue, soit à titre de seuls bénéficiaires soit en concours avec d’autres légataires. La preuve de ces donations entre vifs incombe à celui des héritiers ab intestat ou à celui des légataires qui l’invoque. Toutefois, ne sont pas pris en considération les dons manuels ne dépassant pas le montant de 125.000 francs congolais pour autant que ceux-ci totalisés ne dépassent pas 620.000 francs congolais. Dans tous les cas de réduction, celle-ci se répartira en proportion de la part successorale initiale attribuée à chaque héritier.
              renvois: []
