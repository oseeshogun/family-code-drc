              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                A défaut d’héritiers des quatre catégories, la succession est dévolue à l’État. En pareil cas, l’hérédité sera provisoirement acquise à l’Etat un an à dater de la publication de l’existence d’une succession en déshérence. Cette publication sera faite par l’Etat dans deux journaux du pays, dont l’un doit se trouver dans la province de l’ouverture de la succession et précisera l’identité complète du de cujus et le lieu d’ouverture de celle-ci. Si aucun journal ne paraît dans la province de l’ouverture de la succession, la publicité doit être effectuée par voie d’affichage au chef-lieu de la province, aux sièges administratifs des territoires, des villes, des communes, des secteurs et des chefferies. Après ce délai, les héritiers, qui se présenteront, recevront l’hérédité dans l’état où elle se trouve, déduction faite des frais de garde, de gestion et d’éventuelles dispositions faites par l’État. Après cinq ans à dater de la publication, la succession est définitivement acquise à l’État.
              alineas:
