                  contenu: |-
                    Tant que la succession n'est pas liquidée, elle constitue un patrimoine distinct.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Tant que la succession n'est pas liquidée, elle constitue un patrimoine distinct.
