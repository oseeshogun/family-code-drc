              - numero: "811 bis"
                numero_tri: 811.1
                ordre: 815
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    La succession des conjoints décédés, et dont les héritiers de la première catégorie sont tous en âge de minorité, ne peut être liquidée avant que certains héritiers ne soient majeurs. En attendant la majorité des héritiers de la première catégorie, le Tribunal pour enfants désigne deux administrateurs issus de la famille du père et de la mère prédécédés sur proposition des conseils des familles. Un inventaire des biens des parents prédécédés est établi en quatre exemplaires. Un exemplaire est remis au Tribunal pour enfants, aux héritiers, représentés par le Ministère public du domicile des parents prédécédés et aux administrateurs. Les administrateurs exécutent notamment les charges ci-après : •
                    déterminer la masse successorale et consigner le titre immobilier parcellaire dans une institution bancaire ;
                    •
                    fixer d’une manière provisoire ceux qui doivent venir à l’hérédité ;
                    •
                    payer les dettes de la succession qui sont exigibles ;
                    •
                    assurer les dispositions particulières du testament ;
                    •
                    payer les salaires et traitements dus par le de cujus ;
                    •
                    payer les dettes du de cujus pour lesquelles il fera les recherches et avis publics qui s’imposent et distinguera les dettes exigibles de celles qui ne le sont pas ;
                    •
                    rendre compte final de sa gestion aux héritiers, les conseils de famille à ceux qui sont venus à l’hérédité ou au tribunal compétent, s’il s’agit d’un liquidateur judiciaire.
                    Dès leur désignation, les administrateurs sont tenus de déclarer leurs biens au Tribunal pour enfants visé à l’alinéa 2 ci-dessus. Jusqu’à la désignation du liquidateur, les administrateurs posent tous les actes de gestion et d’administration prévus à l’article 797 de la présente loi, à l’exception des actes de disposition et de liquidation de la succession.
