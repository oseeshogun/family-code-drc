              - numero: "795"
                numero_tri: 795.0
                ordre: 798
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    En cas de succession ab intestat, les héritiers de la première catégorie désignent parmi eux un liquidateur. A défaut, le plus âgé des héritiers est chargé de la liquidation de la succession. Si les liquidateurs ont été désignés par le testament ou s’il y a un légataire universel, la liquidation de la succession leur sera attribuée. Lorsque le testament désigne plusieurs légataires universels, le liquidateur sera le plus âgé d’entre eux. Si les héritiers légaux et testamentaires mineurs ou interdits sont présents à la succession, le liquidateur de la succession devra être confirmé par le Tribunal de paix, pour les héritages ne dépassant pas 1.250.000 francs congolais et par le Tribunal de grande instance pour les autres héritages. Toutefois, par décision motivée, susceptible de recours, le tribunal compétent peut désigner un autre liquidateur parmi les héritiers. Lorsque les héritiers ne sont pas encore connus ou sont trop éloignés ou qu’ils ont tous renoncé à l’hérédité ou en cas de contestation grave sur la liquidation, le tribunal compétent désigne d’office ou à la requête du Ministère public ou d’un des héritiers, un liquidateur judiciaire parent ou étranger à la famille.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          En cas de succession ab intestat, les héritiers de la première catégorie désignent parmi eux un liquidateur. A défaut, le plus âgé des héritiers est chargé de la liquidation de la succession. Si les liquidateurs ont été désignés par le testament ou s’il y a un légataire universel, la liquidation de la succession leur sera attribuée. Lorsque le testament désigne plusieurs légataires universels, le liquidateur sera le plus âgé d’entre eux. Si les héritiers légaux et testamentaires mineurs ou interdits sont présents à la succession, le liquidateur de la succession devra être confirmé par le Tribunal de paix, pour les héritages ne dépassant pas 1.250.000 francs congolais et par le Tribunal de grande instance pour les autres héritages. Toutefois, par décision motivée, susceptible de recours, le tribunal compétent peut désigner un autre liquidateur parmi les héritiers. Lorsque les héritiers ne sont pas encore connus ou sont trop éloignés ou qu’ils ont tous renoncé à l’hérédité ou en cas de contestation grave sur la liquidation, le tribunal compétent désigne d’office ou à la requête du Ministère public ou d’un des héritiers, un liquidateur judiciaire parent ou étranger à la famille.
