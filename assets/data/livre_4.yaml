              date_fin_vigueur: null
              contenu: |-
                Est indigne de succéder et comme tel exclu de l'hérédité, l'héritier légal ou le légataire: a) qui a été condamné pour avoir causé intentionnellement la mort ou voulu attenter à la vie du de cujus; b) qui a été condamné pour dénonciation calomnieuse ou faux témoignage, lorsque cette dénonciation calomnieuse ou ce faux témoignage aurait pu entraîner à l'encontre du de cujus, une condamnation à une peine de cinq ans de servitude pénale au moins;
                c) qui, du vivant du de cujus, a volontairement rompu les relations parentales avec ce dernier, cette situation devant être prouvée devant le tribunal de paix, le conseil de famille entendu; d) qui, au cours des soins à devoir apporter au de cujus lors de sa dernière maladie, a délibérément négligé de les donner, alors qu'il y était tenu conformément à la loi ou à la coutume; e) qui, abusant de l'incapacité physique ou mentale du de cujus, a capté dans les trois mois qui ont précédé son décès, tout ou partie de l'héritage; f) qui a intentionnellement détruit, fait disparaître ou altéré le dernier testament du de cujus sans l'assentiment de celui-ci ou qui s'est prévalu, en connaissance de cause, d'un faux testament ou d'un testament devenu sans valeur.
              alineas:
