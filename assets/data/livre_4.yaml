                    Les libéralités au profit des provinces, des villes ou communes, des secteurs ou chefferies, des établissements publics ou d’utilité publique n’ont leur effet qu’autant qu’elles sont acceptées par l’autorité compétente. Cette acceptation lie le donateur dès qu’elle lui a été notifiée. Cette notification peut être constatée par une déclaration du donateur authentiquement certifiée au bas de l’acte portant acceptation. Lorsque la libéralité a pour objet des biens susceptibles d’hypothèque, la transcription des actes contenant la libéralité et l’acceptation ainsi que la notification de l’acceptation, doivent être faites au bureau du conservateur des titres immobiliers dans la province où les biens sont situés.
