              texte_source: null
              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                Les père et mère et autres ascendants peuvent faire, entre leurs enfants et descendants, le partage et la distribution de leurs biens. Si le partage se réalise par donation entre vifs, on l'appelle donation-partage ; il est le testament partage s'il se réalise par testament.
              alineas:
                - ordre: 1
                  type: alinea
                  contenu: |-
                      Les père et mère et autres ascendants peuvent faire, entre leurs enfants et descendants, le partage et la distribution de leurs biens. Si le partage se réalise par donation entre vifs, on l'appelle donation-partage ; il est le testament partage s'il se réalise par testament.
