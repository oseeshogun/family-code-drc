              date_fin_vigueur: null
              contenu: |-
                1.Les enfants du de cujus nés dans le mariage et ceux nés hors mariage mais affiliés de son vivant ainsi que les enfants adoptifs forment la première catégorie des héritiers de la succession. Si les enfants ou l’un des enfants du de cujus sont morts avant lui et qu’ils ont laissé des descendants, ils sont représentés par ces derniers dans la succession.
                2. Le conjoint survivant, les père et mère, les frères et sœurs germains ou consanguins ou utérins forment la deuxième catégorie des héritiers de la succession et constituent trois groupes distincts. Lorsque les père et mère du de cujus ou l’un d’eux sont décédés avant lui mais que leurs père et mère ou l’un d’eux sont encore en vie, ceux-ci viennent à la succession en leurs lieu et place. Lorsque les frères et sœurs du de cujus ou l’un d’eux sont décédés avant lui mais qu’ils ont laissé des descendants, ils sont représentés par ceux-ci dans la succession.
                3. Les oncles et les tantes paternels ou maternels constituent la troisième catégorie des héritiers de la succession. Lorsque les oncles et tantes paternels ou maternels du de cujus ou l’un d’eux sont décédés avant lui mais qu’ils ont laissé des descendants, ils sont représentés par ceux-ci dans la succession.
