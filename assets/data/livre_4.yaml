                  contenu: |-
                    La renonciation de l'héritier a pour effet de retenir celui-ci comme n'ayant jamais été appelé à la succession du de cujus; sa part est dévolue aux autres héritiers légaux ou testamentaires qui ont accepté mais qui peuvent éventuellement renoncer à cette part d'hérédité. La renonciation ne devient irrévocable qu'au jour où le délai de trois mois prévu à l'article 801, alinéa 2, est écoulé, à moins lue cette renonciation n'ait été obtenue par vol, violence ou menace d'un autre héritier. Toutefois, si la renonciation n'est pas retirée un an après la cessation de la violence ou de la menace ou de la découverte du dol dont l'héritier a été victime, elle devient irrévocable.
