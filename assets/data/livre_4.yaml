              contenu: |-
                Lorsque les biens dont le père ou la mère a disposé dépassent en valeur les trois quarts de la succession qui revient à ses enfants, les parts testamentaires seront réduites à la quotité disponible. La réduction se fera entre les légataires proportionnellement aux legs dont ils ont été déclarés bénéficiaires.
              alineas:
