              date_fin_vigueur: null
              contenu: |-
                Si le testateur n'a pas d'enfant, la quotité disponible ne peut excéder la moitié des biens s'il y a au moins deux groupes de la deuxième catégorie représentés à la succession et les deux tiers s'il n'y en a qu'un seul. La réduction se fera entre les légataires proportionnellement aux legs dont ils ont été déclarés bénéficiaires.
