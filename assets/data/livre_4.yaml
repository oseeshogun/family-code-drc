                  date_fin_vigueur: null
                  contenu: |-
                    Aux termes de la présente loi, une libéralité est un acte par lequel une personne transfère à une autre un droit patrimonial sans en attendre une contrepartie égale.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Aux termes de la présente loi, une libéralité est un acte par lequel une personne transfère à une autre un droit patrimonial sans en attendre une contrepartie égale.
                  renvois: []
              - numero: "820"
