              contenu: |-
                Toute institution contractuelle doit, à peine de nullité, être stipulée par acte authentique établi soit par un notaire soit par un officier de l'état civil. L'institution contractuelle est portée à la connaissance de l'officier de l'état civil, soit au moment de l'enregistrement du mariage, soit au moment de sa célébration, soit dans l'acte de mariage. Elle n'est opposable aux tiers que lorsque l'officier de l'état civil en porte mention dans l'acte de mariage. Dans les cas visés aux alinéas précédents, l'officier de l'état civil en portera la mention de la donation dans l'acte constatant le régime matrimonial des époux.
