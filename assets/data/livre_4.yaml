                    Nul n'est tenu d'accepter les fonctions de liquidateur. Le liquidateur ne peut se démettre de ses fonctions que lorsqu'il invoque de justes motifs acceptés par le tribunal compétent. Le désistement ne devient effectif qu'à partir du moment où il est accepté par le tribunal et qu'un nouveau liquidateur a été désigné.
