              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                Le testament est un acte personnel du de cujus par lequel il dispose pour le temps où il ne sera plus, de son patrimoine, le répartit, détermine ses héritiers et fixe les dispositions tutélaires, funéraires ou de dernière volonté que la présente loi n'interdit pas et auxquelles des effets juridiques sont attachés. Le testament peut être fait sous forme authentique, olographe ou orale à l'article de la mort. Toute autre forme de testament est nulle.
              alineas:
