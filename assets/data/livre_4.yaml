              date_fin_vigueur: null
              contenu: |-
                Le legs universel ou à titre universel est la disposition par laquelle le testateur appelle une ou plusieurs personnes à recueillir en propriété, l'intégralité ou une quote-part des biens de la succession, soit mathématique, soit mobilière, soit immobilière. Toute autre disposition constitue des legs particuliers. Tout legs universel ou particulier doit être individualisé au profit de qui ou de quelle institution il est institué, sauf lorsqu'il s'agit de legs aux pauvres. En ce cas, il est censé devoir profiter aux pauvres de la collectivité où le de cujus avait, au moment de son décès, son domicile ou sa résidence principale. L’administration de la collectivité représentera dans la liquidation et le partage de l'héritage les bénéficiaires du legs.
