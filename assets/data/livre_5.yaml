          contenu: |-
            Les mariages monogamiques contractés conformément à la coutume antérieurement à la date d'entrée en vigueur de la présente loi ainsi que les mariages célébrés conformément au code civil, demeurent valides. Leurs effets extrapatrimoniaux sont régis par la présente loi ; celle-ci s'applique également pour la dissolution du lien matrimonial aux unions antérieures à sa mise en vigueur. Les divorces, séparations de corps ou annulation prononcés par décision passée en force de chose jugée avant l'entrée en vigueur de la présente loi, produisent les effets prévus par la loi ou la coutume en vigueur au moment où ils sont intervenus
