      - numero: "928"
        numero_tri: 928.0
        ordre: 935
        version:
          num_version: 1
          statut: en_vigueur
          texte_source: null
          date_debut_vigueur: null
          date_fin_vigueur: null
          contenu: |-
            Les époux, ayant contracté mariage avant l’entrée en vigueur de la Loi n° 87-010 du 1er août 1987, sont régis par le régime de la communauté réduite aux acquêts avec gestion concertée.
            Toutefois, les époux peuvent, par déclaration conjointe faite devant l’officier de l’état civil de leur résidence, soit opter pour un des deux autres régimes organisés par la loi, soit opter, dans le cadre du régime choisi par eux, pour la gestion séparée de leurs biens propres. Cette déclaration est affichée dans le mois au bureau de l’état civil, à la diligence de l’officier de l’état civil qui, en même temps, enverra copie de la déclaration d’option pour publication au Journal officiel. Si les deux époux ou l’un d’entre eux sont commerçants, ils doivent, dans le mois de leur déclaration, adresser en outre, copie de celle- ci au registre du commerce et de crédit mobilier auquel les époux ou l’un d’eux sont inscrits. La déclaration prend effet : •
            à dater du jour où elle est faite en ce qui concerne les époux ;
            •
            dans le mois qui suit son affichage par l’officier de l’état civil vis -à – vis des tiers ;
            •
            à dater du jour de l’inscription au registre du commerce, en ce qui concerne les époux commerçants ou l’un d’entre eux, vis-à-vis des tiers ayant avec eux des relations commerciales.
            Après un an, si les époux n’ont pas fait de déclaration d’option, ils ne peuvent modifier le régime de la communauté réduite aux acquêts que conformément aux dispositions ordinaires de la présente loi.
          alineas:
            - ordre: 1
              type: alinea
              contenu: |-
                  Les époux, ayant contracté mariage avant l’entrée en vigueur de la Loi n° 87-010 du 1er août 1987, sont régis par le régime de la communauté réduite aux acquêts avec gestion concertée.
