          contenu: |-
            Lorsque les époux avaient établi un contrat régissant leur régime matrimonial, soit avant, soit pendant leur union, ils resteront régis par celui-ci à moins que dans l'année qui suit rentrée en vigueur de la présente loi, ils ne fassent une déclaration d'option conjointe devant l'officier de l'état civil de leur résidence, pour l'un des régimes organisés par la loi. Après un an, si les époux n'ont pas fait de déclaration d'option, ils ne pourront modifier le contrat régissant leur régime matrimonial que conformément aux dispositions de la présente loi.
