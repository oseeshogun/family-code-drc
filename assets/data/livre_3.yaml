                        Le mariage est célébré publiquement au bureau de l’état civil du domicile ou de la résidence de l’un des futurs époux. S’il y a de justes motifs, le Président du Tribunal de paix peut, toutefois, autoriser la célébration du mariage dans un autre lieu. L’autorisation est notifiée par le greffier à l’officier de l’état civil chargé de procéder à la célébration ; avis en est donné au Procureur de la République du ressort et copie remise aux futurs époux. Mention de cette autorisation est faite dans l’acte de mariage. En cas de péril imminent de mort de l’un des futurs époux, l’officier de l’état civil peut se transporter, avant toute autorisation du juge de paix, au domicile ou à la résidence de l’une des parties pour y célébrer le mariage, même si la résidence n’est pas établie depuis un mois d’habitation continue. L’officier de l’état civil fait ensuite part au Procureur de la République du ressort, dans le plus bref délai, de la nécessité de cette célébration.
