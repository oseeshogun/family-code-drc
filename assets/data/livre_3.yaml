                  - numero: "460"
                    numero_tri: 460.0
                    ordre: 459
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Lorsque l’un des époux prétend que l’autre a manqué à ses devoirs, il peut, après plusieurs tentatives d’harmonisation, exercer un recours devant le Tribunal de paix. Le Président du Tribunal de paix saisi par une requête, tentera, en chambre de conseil, de concilier les époux. Il peut notamment faire comparaître les époux en personne ainsi que leurs parents respectifs, appeler en chambre de conseil les personnes susceptibles de promouvoir la conciliation, envoyer les époux, l’un d’eux ou leurs parents devant une réunion familiale ou, à défaut, convoquer un conseil de famille qu’il préside. Si la conciliation aboutit, le président acte, par voie d’ordonnance, l’accord des parties. Si la conciliation n’aboutit pas, le Président rend une ordonnance constatant l’échec et autorisant la partie requérante à saisir le tribunal.
                      alineas:
