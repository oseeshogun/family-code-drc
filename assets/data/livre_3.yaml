                      contenu: |-
                        Nul ne peut contracter un nouveau mariage avant la dissolution ou l'annulation du précédent. Lorsque la dissolution ou l'annulation résulte d'une décision judiciaire ou du décès de l'autre conjoint, le nouveau mariage ne peut être conclu que lorsque mention de la dissolution ou de l'annulation a été faite en marge de l'acte de mariage, ou lorsque la preuve du décès de l'autre conjoint a été faite devant l'officier de l'état civil.
