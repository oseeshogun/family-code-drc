                  - numero: "482"
                    numero_tri: 482.0
                    ordre: 481
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Sur requête verbale ou écrite de l'époux intéressé, les époux sont convoqués devant le tribunal de paix par un avertissement du greffier précisant l'objet de la demande. Le tribunal peut ordonner aux époux et même aux tiers, la communication des renseignements ou la présentation des livres de commerce ou des pièces comptables de nature à établir le montant des revenus, créances et produits du travail des parties; les renseignements fournis par les tiers sont communiqués au tribunal par écrit. S'il n'est pas donné suite aux injonctions du tribunal, dans le délai qu'il détermine, ou si les renseignements donnés apparaissent incomplets ou inexacts, le tribunal peut par jugement ordonner que le tiers comparaisse en personne à la date qu'il fixe. Une copie certifiée conforme est jointe à la convocation du tiers. Lorsque le tribunal ordonne à l'administration des contributions directes de fournir des renseignements qu'elle possède sur le montant des revenus, créances et produits du travail des époux ou de l'un d'eux, le secret imposé aux fonctionnaires de cette administration en vertu des dispositions relatives aux impôts sur le revenu est levé. Le jugement est notifié aux parties par le greffier.
                      alineas:
