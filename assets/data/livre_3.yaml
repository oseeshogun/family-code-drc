              contenu: |-
                Le consentement de l’adoptant et de l’adopté est donné en personne, devant le tribunal. Lorsqu’il n’est pas donné en personne devant le tribunal, le consentement de l’adoptant, du père et de la mère de l’adopté, de la personne chargée de donner son consentement conjointement avec l’un des parents conformément aux articles 662 et 663 de la présente loi, du tuteur ou du conseil de famille de l’adopté, du conjoint de l’adoptant et de l’adopté, celui-ci doit résulter d’un acte authentique. S’agissant de l’adoption internationale, outre le consentement de toutes les parties à l’instance d’adoption, le tribunal s’assure, sur base des procès-verbaux d’enquête ou de toutes autres pièces versés au dossier et l’instruction à l’audience, de : •
                la difficulté de garder l’enfant au sein de la famille élargie ou de la communauté locale ;
                •
                la difficulté d’une prise en charge sociale alternative en République Démocratique du Congo ;
                •
                l’existence d’un lien légal de mariage entre l’adoptant et un conjoint de sexe opposé avec lequel il cohabite sous un même toit ;
                •
                la non pertinence de la précarité ou de la pauvreté de parents ou de la famille comme seule motivation de l’adoption ;
                •
                la nature exceptionnelle de l’adoption sollicitée, uniquement guidée par l’intérêt supérieur de l’enfant.
                Le consentement donné par acte authentique peut être rétracté dans les mêmes formes, jusqu’au dépôt de la requête aux fins d’adoption.
