                            Le Président du Tribunal de paix convoque ensuite le requérant, lui adresse à huis clos les observations qu’il estime nécessaires et convenables et attire son attention sur la gravité de la requête introduite. A défaut de répondre à la convocation et sauf cas de force majeure, la requête ne peut être réintroduite qu’après un délai de six mois.
                          alineas:
