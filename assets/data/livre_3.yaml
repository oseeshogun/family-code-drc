              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                Lorsque le nom de la mère n'est pas indiqué dans l'acte de naissance de son enfant, la mère peut faire une déclaration de maternité.
                Celle-ci est faite devant l'officier de l'état civil, qui l'inscrit dans l'acte de naissance ou en dresse un acte séparé. La déclaration de maternité peut être faite même si la mère est incapable. Dans ce cas, elle agit seule. La déclaration de maternité peut être contestée du fait de l'incapacité résultant de l'interdiction judiciaire par le tuteur de l'interdit et, après la mainlevée de l'interdiction, par l'auteur de la déclaration.
              alineas:
