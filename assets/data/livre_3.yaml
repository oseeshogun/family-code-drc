                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    La parenté résulte de la filiation d'origine. Elle résulte en outre de la paternité juridique et de la filiation adoptive dans la mesure déterminée par les dispositions relatives à la filiation et à l'adoption.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          La parenté résulte de la filiation d'origine. Elle résulte en outre de la paternité juridique et de la filiation adoptive dans la mesure déterminée par les dispositions relatives à la filiation et à l'adoption.
                  renvois: []
              - numero: "696"
                numero_tri: 696.0
                ordre: 699
                version:
                  num_version: 1
                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Les filiations successives forment une ligne de parenté. Sont parents en ligne directe les personnes qui descendent les unes des autres. La descendance s'établit en suivant le cours des générations, l'ascendance, en le remontant. Les ascendants du côté du père forment la ligne paternelle et ceux du côté de la mère la ligne maternelle. Sont parents en ligne collatérale les personnes qui descendent d'un auteur commun, sans descendre les unes des autres; les collatéraux par le père sont dits consanguins, par la mère, utérins. Sont germains les collatéraux qui ont une double parenté par le père et par la mère. La ligne patrilinéaire est constituée par tous ceux qui descendent d'un ancêtre commun exclusivement en ligne masculine; la ligne matrilinéaire est constituée par tous ceux qui descendent d'une aïeule commune exclusivement en ligne féminine. La parenté est dite bilatérale lorsqu'' aucune distinction n'est faite entre lignes patrilinéaire et matrilinéaire.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
