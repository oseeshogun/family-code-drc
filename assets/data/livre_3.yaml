                      - type: subdivision
                        numero: A
                        intitule: "Du régime de la séparation des biens"
                        ordre: 1
                        chemin: "3.1.5.4.2.2.1"
                        articles:
                          - numero: "505"
                            numero_tri: 505.0
                            ordre: 504
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                Le régime de la séparation des biens consacre l'existence de deux patrimoines propres formés par tous les biens acquis à titre onéreux ou à titre gratuit par chacun des époux ainsi que par leurs dettes.
                              alineas:
                                - ordre: 1
                                  type: alinea
                                  contenu: |-
                                      Le régime de la séparation des biens consacre l'existence de deux patrimoines propres formés par tous les biens acquis à titre onéreux ou à titre gratuit par chacun des époux ainsi que par leurs dettes.
                              renvois: []
                          - numero: "506"
                            numero_tri: 506.0
                            ordre: 505
                            entete_au_pluriel: true
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                Au moment de la célébration ou de l'enregistrement du mariage, si les époux optent pour la séparation des biens, ils peuvent établir et remettre à l'officier de l'état civil qui célèbre ou enregistre leur mariage, un inventaire signé par eux et précisant les biens meubles et immeubles dont ils ont la propriété ou possession légale antérieurement au mariage. Ce document est signalé dans l'acte et fait pleine foi de leur appartenance sauf preuve légale contraire en matière de biens fonciers et immobiliers enregistrés.
                              alineas:
                                - ordre: 1
                                  type: alinea
                                  contenu: |-
                                      Au moment de la célébration ou de l'enregistrement du mariage, si les époux optent pour la séparation des biens, ils peuvent établir et remettre à l'officier de l'état civil qui célèbre ou enregistre leur mariage, un inventaire signé par eux et précisant les biens meubles et immeubles dont ils ont la propriété ou possession légale antérieurement au mariage. Ce document est signalé dans l'acte et fait pleine foi de leur appartenance sauf preuve légale contraire en matière de biens fonciers et immobiliers enregistrés.
                              renvois: []
                          - numero: "507"
                            numero_tri: 507.0
                            ordre: 506
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                Tant à l'égard de son conjoint que des tiers, un époux peut prouver qu'il a la propriété ou possession légale d'un bien par tous moyens, sous réserve des dispositions spéciales relatives aux concessions des immeubles enregistrés. Cependant, d'après leur nature et leur destination, les biens meubles qui ont un caractère personnel et les droits exclusivement attachés à la personne sont présumés appartenir à l'un ou l'autre des époux. La preuve contraire se fait par tout moyen propre à établir que les biens n'appartiennent pas au conjoint que la loi désigne.
                                Il peut également être prouvé que le bien a été acquis par une libéralité du conjoint, suivant les règles propres aux donations entre époux.
                              alineas:
                                - ordre: 1
                                  type: alinea
                                  contenu: |-
                                      Tant à l'égard de son conjoint que des tiers, un époux peut prouver qu'il a la propriété ou possession légale d'un bien par tous moyens, sous réserve des dispositions spéciales relatives aux concessions des immeubles enregistrés. Cependant, d'après leur nature et leur destination, les biens meubles qui ont un caractère personnel et les droits exclusivement attachés à la personne sont présumés appartenir à l'un ou l'autre des époux. La preuve contraire se fait par tout moyen propre à établir que les biens n'appartiennent pas au conjoint que la loi désigne.
                                - ordre: 2
                                  type: alinea
                                  contenu: |-
                                      Il peut également être prouvé que le bien a été acquis par une libéralité du conjoint, suivant les règles propres aux donations entre époux.
                              renvois: []
                          - numero: "508"
                            numero_tri: 508.0
                            ordre: 507
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                Lorsque par la volonté des conjoints, la gestion des biens n’est pas conjointe, chacun des conjoints administre ses biens et en perçoit les revenus. Ils peuvent en disposer librement sauf ce qui est stipulé à l’article 499 de la présente loi.
                              alineas:
