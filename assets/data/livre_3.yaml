                              Les greffiers des Tribunaux pour enfants, des Tribunaux de paix et de grande instance peuvent percevoir les sommes alimentaires des mains des débiteurs et les verser aux créanciers d’aliments. Le tribunal peut contraindre le débiteur de l’obligation alimentaire de s’acquitter de sa dette par l’intermédiaire du greffe.
