                              date_fin_vigueur: null
                              contenu: |-
                                En cas de modification du régime de la communauté universelle, conformément à l'article 494, la communauté universelle sera partagée par moitié tant activement que passivement, comme en cas de dissolution du mariage. Les dettes contractées avant la modification du régime pourront être poursuivies par les tiers après celles-ci, solidairement sur le patrimoine des époux et éventuellement avant partage, sur ce qui subsiste du patrimoine commun.
                                Le règlement entre époux de ces dettes se fera conformément à l'article 529.
                              alineas:
