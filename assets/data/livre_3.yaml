                  date_fin_vigueur: null
                  contenu: |-
                    Un contrat relatif au versement d'aliments peut être conclu à titre gratuit entre personnes qui ne sont pas tenues légalement à l'obligation alimentaire ou lorsque les conditions d'existence de celle-ci ne sont pas remplies. Une telle convention, prouvée selon les règles du droit commun, ne pourra couvrir une période supérieure à trois ans. Cependant, elle sera susceptible de renouvellement. Les prestations fournies en exécution du contrat constituent des libéralités soumises aux règles propres aux donations.
