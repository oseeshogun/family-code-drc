                  - numero: "370"
                    numero_tri: 370.0
                    ordre: 369
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Dans les trois mois qui suivent la célébration du mariage en famille, les époux et, éventuellement, leurs mandataires se présentent devant l’officier de l’état civil du lieu de la célébration en vue de faire constater le mariage et d’assurer sa publicité et son enregistrement. Chacun des époux est accompagné d’un témoin. Les époux peuvent se faire représenter par un mandataire porteur d’une procuration écrite. Celui-ci sera un proche parent, sauf empêchement valable dûment constaté par l’officier de l’état civil. Les témoins doivent être majeurs et capables. Ils sont pris dans la lignée paternelle ou maternelle de chacun des époux, sauf empêchement valable dûment constaté par l’officier de l’état civil. Dans les quinze jours qui suivent, l’officier de l’état civil porte à la connaissance du public, par voie de proclamation faite au moins deux fois et/ou par affichage apposé à la porte du bureau de l’état civil, l’acte constatant la célébration du mariage. Le délai de quinze jours écoulé, l’officier de l’état civil assure l’enregistrement du mariage par la constatation de la formalité de la publication.
                      alineas:
