                        4.les éventuelles décisions de mainlevée d’opposition ;
                        5.l’état civil antérieur des époux ;
                        6.la convention relative à la dot conformément aux articles 361 à 366 ou la décision judiciaire prévue à l’article 367 de la présente loi ;
                        7.le choix du régime matrimonial adopté par les époux ;
                        8. l’accomplissement public de l’enregistrement ou de la célébration : Primo : en cas d’enregistrement, la déclaration des contractants qu’ils se sont pris pour époux avec l’indication de la date de la célébration familiale du mariage, l’indication que les formalités du mariage ont été suivies conformément aux articles 369 et suivants de la présente loi. Et, le cas échéant, les noms, profession, nationalité, domicile et résidence du ou des témoins coutumiers du mariage ; Secundo : en cas de célébration du mariage par l’officier de l’état civil, l’accomplissement des formalités de publication, la déclaration des contractants de se prendre pour époux et le prononcé de leur union par l’officier de l’état civil ;
                        9.la nature de toutes les pièces produites.
