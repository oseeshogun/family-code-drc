                          - numero: "509"
                            numero_tri: 509.0
                            ordre: 508
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                En cas de gestion personnelle, conventionnelle ou légale de ses biens propres, l’époux peut librement donner mandat à son conjoint de gérer tout ou partie de ses biens personnels. Le mandataire est cependant dispensé de rendre compte des fruits si la procuration ne l’y oblige pas expressément. Quand l’un des conjoints gère les biens de l’autre au su de celui-ci, mais sans opposition de sa part, il est présumé avoir reçu mandat pour les seuls actes d’administration à l’exclusion de tout acte de disposition. Il est comptable des fruits existants et peut être tenu dans la limite des cinq dernières années pour ceux qu’il aurait négligé de percevoir ou qu’il aurait consommés frauduleusement. Si l’un des époux s’immisce dans la gestion des biens du conjoint, malgré l’opposition de celui-ci, il est responsable de toutes les suites de son immixtion et comptable sans limitation de tous les fruits, tant existants que consommés.
                              alineas:
                                - ordre: 1
                                  type: alinea
                                  contenu: |-
                                      En cas de gestion personnelle, conventionnelle ou légale de ses biens propres, l’époux peut librement donner mandat à son conjoint de gérer tout ou partie de ses biens personnels. Le mandataire est cependant dispensé de rendre compte des fruits si la procuration ne l’y oblige pas expressément. Quand l’un des conjoints gère les biens de l’autre au su de celui-ci, mais sans opposition de sa part, il est présumé avoir reçu mandat pour les seuls actes d’administration à l’exclusion de tout acte de disposition. Il est comptable des fruits existants et peut être tenu dans la limite des cinq dernières années pour ceux qu’il aurait négligé de percevoir ou qu’il aurait consommés frauduleusement. Si l’un des époux s’immisce dans la gestion des biens du conjoint, malgré l’opposition de celui-ci, il est responsable de toutes les suites de son immixtion et comptable sans limitation de tous les fruits, tant existants que consommés.
                              renvois: []
                          - numero: "510"
                            numero_tri: 510.0
                            ordre: 509
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                En cas de gestion par l’un des conjoints, à la dissolution du mariage, chacun des époux reprend ses biens propres en nature, en justifiant qu’il en est propriétaire ou concessionnaire. Au cas où le patrimoine de l’un s’est enrichi au détriment de l’autre, le patrimoine appauvri doit être directement indemnisé par le patrimoine enrichi, soit en nature soit en équivalent. Si l’enrichissement fait au détriment du patrimoine de l’un des conjoints résulte d’une mauvaise administration de l’autre, une indemnité complémentaire peut être demandée en justice.
                              alineas:
                                - ordre: 1
                                  type: alinea
                                  contenu: |-
                                      En cas de gestion par l’un des conjoints, à la dissolution du mariage, chacun des époux reprend ses biens propres en nature, en justifiant qu’il en est propriétaire ou concessionnaire. Au cas où le patrimoine de l’un s’est enrichi au détriment de l’autre, le patrimoine appauvri doit être directement indemnisé par le patrimoine enrichi, soit en nature soit en équivalent. Si l’enrichissement fait au détriment du patrimoine de l’un des conjoints résulte d’une mauvaise administration de l’autre, une indemnité complémentaire peut être demandée en justice.
                              renvois: []
                          - numero: "511"
                            numero_tri: 511.0
                            ordre: 510
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                En cas de gestion par l’un des conjoints, le patrimoine foncier et immobilier du gestionnaire est grevé d’une hypothèque légale pour sûreté du patrimoine de l’autre. Le patrimoine visé est celui qui existe au moment de la dissolution, déduction toutefois des donations qui ont été faites par le gestionnaire à l’autre conjoint. L’hypothèque légale visée à l’alinéa premier prend date au jour de la requête en divorce ou au jour du décès de l’un des conjoints.
