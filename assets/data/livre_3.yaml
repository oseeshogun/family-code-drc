                      contenu: |-
                        La femme ne peut se remarier qu'après l'expiration d'un délai de trois cents jours à compter de la dissolution ou de l'annulation du précédent mariage. Ce délai prend fin en cas d'accouchement.
                        En outre, le président du tribunal de paix dans le ressort duquel le mariage doit être célébré, peut, par ordonnance rendue sur requête de la femme, fixer un délai moindre, lorsque celle-ci prouve que son ancien mari s'est trouvé de manière continue dans l'impossibilité de cohabiter avec elle. Il peut supprimer ce délai si cette impossibilité de cohabiter a duré au moins cent jours ou si la femme fait établir médicalement qu'elle n’est pas enceinte.
