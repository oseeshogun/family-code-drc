                      contenu: |-
                        Sous réserve des dispositions de l’article 351 alinéa 2 de la présente loi, les futurs époux, accompagnés d’un témoin, parent ou non, comparaissent ensemble et en personne devant l’officier de l’état civil. L’officier leur fait lecture des pièces relatives à leur état civil et de leur déclaration relative à la dot ainsi qu’au régime matrimonial adopté. Il les instruit ensuite de leurs droits et devoirs respectifs. Il reçoit de chacune des parties la déclaration qu’elles veulent se prendre pour mari et femme. Il prononce qu’elles sont unies par le mariage.
                        Il signe sur-le-champ l’acte de mariage avec les époux et les témoins s’ils sont présents. Si l’un des comparants ne sait ou ne peut signer, la signature peut être remplacée par l’apposition de l’empreinte digitale et mention en est faite à l’acte. Il est délivré aux époux le volet 1 de l’acte de mariage et un livret de ménage établi conformément aux dispositions relatives à l’état civil.
