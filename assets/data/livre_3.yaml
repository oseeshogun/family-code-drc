                intitule: De la dot
                ordre: 3
                chemin: "3.1.3.2.3"
                articles:
                  - numero: "361"
                    numero_tri: 361.0
                    ordre: 360
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Le futur époux et sa famille doivent convenir avec les parents de la future épouse d’une remise de biens et/ou d’argent qui constituent la dot au bénéfice des parents de la future épouse. Le mariage ne peut être célébré que si la dot a été effectivement versée au moins en partie. Nonobstant toute coutume contraire, la dot peut être symbolique.
                      alineas:
                        - ordre: 1
                          type: alinea
                          contenu: |-
                              Le futur époux et sa famille doivent convenir avec les parents de la future épouse d’une remise de biens et/ou d’argent qui constituent la dot au bénéfice des parents de la future épouse. Le mariage ne peut être célébré que si la dot a été effectivement versée au moins en partie. Nonobstant toute coutume contraire, la dot peut être symbolique.
                      renvois: []
                  - numero: "362"
