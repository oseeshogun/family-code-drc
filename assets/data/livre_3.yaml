              contenu: |-
                L’adoption ne peut avoir lieu que s’il y a de justes motifs et si elle présente des avantages pour l’adopté. L’adoption d’un enfant congolais par un étranger n’a lieu que si les autorités congolaises compétentes : •
                Constatent, après avoir dûment examiné les conditions de placement de l’enfant en République Démocratique du Congo, que l’adoption répond à l’intérêt supérieur de l’enfant ;
                •
                Se sont assurées que :
                •
                le consentement n’est pas obtenu moyennant paiement ou contrepartie d’aucune sorte et qu’il n’a pas été retiré ;
                •
                les souhaits et avis de l’enfant sont pris en considération selon son âge et niveau de maturité ;
                •
                le consentement de l’enfant à l’adoption, lorsqu’il est requis, est donné librement, dans les formes légales requises, et que ce consentement est donné ou constaté par écrit.
                Toute adoption est soumise à une enquête sociale préalable.
