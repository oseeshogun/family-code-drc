                        Le tribunal peut ordonner aux parties, et même aux tiers, la communication de renseignements ou la présentation des livres de commerce ou pièces comptables de nature à établir le montant des revenus, créances et produits du travail des parties; les renseignements à fournir par les tiers sont communiqués au tribunal par écrit. S'il n'est pas donné suite aux dispositions du tribunal, dans le délai qu'il détienne, ou si les renseignements donnés apparaissent incomplets ou inexacts, le tribunal peut ordonner que le tiers comparaisse en personne, à la date qu'il fixe. Une copie certifiée conforme de la décision est jointe à la convocation du tiers. Lorsque le tribunal ordonne à l'administration des contributions directes de fournir des renseignements qu'elle possède sur le montant des revenus, créances et produits du travail des parties ou de l'une d'elles, le secret imposé aux fonctionnaires de cette administration est levé.
