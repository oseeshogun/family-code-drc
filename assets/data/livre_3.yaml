                        En cas de demande en justice, le créancier qui aura obtenu un jugement de condamnation pourra réclamer la somme échue depuis la demande en justice, sans que le débiteur puisse opposer la prescription de l'alinéa précédent. Le présent article n'est pas d'application aux diverses obligations à caractère alimentaire régies par des dispositions particulières, notamment aux obligations réciproques des époux et aux obligations des père et mère envers leurs enfants.
