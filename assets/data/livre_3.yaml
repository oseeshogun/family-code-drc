              contenu: |-
                La requête aux fins d’adoption est présentée au tribunal de paix, après avis de l’organisme public chargé des adoptions, par la ou les personnes qui se proposent d’adopter. Sauf pour la requête en adoption par un étranger qui n’est peut être présentée au tribunal du domicile des adoptants ou de l’un d’eux, ou du domicile de l’adopté. Il est joint à la requête des actes de naissance ou des extraits des actes de naissance des adoptants ainsi que de celui qu’on propose d’adopter et éventuellement, l’acte constatant les consentements requis. Ceux qui ont consentis à l’adoption sont avertis de la date de l’audience, dans le délai d’ajournement, augmenté, s’il y a lieu, du délai de distance.
