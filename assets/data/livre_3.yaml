                              contenu: |-
                                En cas de modification du régime matrimonial conformément à l'article 494 en vue d'opter pour le régime de la communauté réduite aux acquêts, les époux peuvent établir un état général de leur actif commun et de leurs actifs propres ainsi que des dettes communes ou propres. Cet état sera homologué par le tribunal. Une copie de cet état sera annexée à l'extrait du jugement soit par les soins du greffier, soit à la diligence des époux conformément aux dispositions de l'article 496 et restera annexée à l'acte de mariage sur lequel mention de la modification du régime matrimonial aura été faite. A défaut par les époux d'établir cet état, les biens acquis ainsi que les dettes contractées pendant l'union, avant modification, seront présumés communs, à moins qu'il ne soit établi par des écrits antérieurs que l'un des époux en avait la propriété ou la concession exclusive et ce, sous réserve des dispositions spéciales relatives aux concessions foncières.
