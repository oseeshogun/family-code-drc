                          num_version: 1
                          statut: en_vigueur
                          texte_source: null
                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            En cas de non-comparution de l’époux requérant, il est présumé s’être désisté de sa requête sauf cas de force majeure. En cas de non-comparution de l’autre époux, le président commet un huissier pour lui notifier une assignation; si celui-ci ne comparaît pas à la date ainsi fixée, il est considéré comme refusant toute conciliation. Toutefois, si l’autre époux réside dans un autre ressort, le président peut, s’il l’estime nécessaire, en cas de non-comparution, commettre rogatoirement le Président du Tribunal de paix du ressort où
                            réside l’autre époux pour qu’il lui soit donné avis de la requête introduite et confirmée ainsi que des observations qu’il a recueillies. Le magistrat délégué acte de son côté les observations formulées par l’autre époux. Dès réception de celles-ci, le Président du Tribunal de paix commettant convoque l’époux requérant.
                          alineas:
                            - ordre: 1
                              type: alinea
