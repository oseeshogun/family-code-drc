                  contenu: |-
                    La convention d'affiliation est conclue entre le père et les membres de la famille maternelle de l'enfant. La convention n'est valable que si la mère de l'enfant, même mineure, l'accepte. L'acceptation de la convention est présumée, lorsque la mère n'a élevé aucune protestation contre cette convention dans le délai d'un an à dater du jour où elle en a eu connaissance et si elle est mineure, un an après sa majorité, dans le cas où elle en avait déjà connaissance.
