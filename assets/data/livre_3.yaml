                      - type: subdivision
                        numero: B
                        intitule: "Du régime de la communauté réduite aux acquêts"
                        ordre: 2
                        chemin: "3.1.5.4.2.2.2"
                        articles:
                          - numero: "516"
                            numero_tri: 516.0
                            ordre: 515
                            version:
