                      date_fin_vigueur: null
                      contenu: |-
                        Les conventions relatives à la dot et les obligations qui en découlent sont prouvées par les énonciations de l'acte de mariage. La convention relative à la dot conclue en vue d'un mariage non encore célébré ou non enregistré, peut être prouvée par tous moyens de droit.
                      alineas:
                        - ordre: 1
                          type: alinea
                          contenu: |-
                              Les conventions relatives à la dot et les obligations qui en découlent sont prouvées par les énonciations de l'acte de mariage. La convention relative à la dot conclue en vue d'un mariage non encore célébré ou non enregistré, peut être prouvée par tous moyens de droit.
                      renvois: []
                  - numero: "367"
                    numero_tri: 367.0
                    ordre: 366
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Si la dot est refusée par ceux qui, selon la coutume, doivent la recevoir, les futurs époux, soit ensemble, soit séparément peuvent porter le litige devant le conseil de famille composé d’au moins quatre membres en raison de deux membres pour chaque famille. Si le refus persiste, les futurs époux ainsi que le Ministère public peuvent saisir, par voie de requête, le Tribunal de paix du lieu où le mariage devrait être célébré. Le Tribunal de paix instruit à huis clos la requête en amiable conciliateur ; il convoque, soit séparément, soit ensemble, le ou les requérants, le père et la mère de la future épouse et ceux de ses ayants droit bénéficiaires de la dot et, s’il estime opportun, un conseil de famille. Sauf le cas où le Ministère public est requérant, sa présence n’est pas obligatoire. Le tribunal tente, s’il échet, d’obtenir un accord, soit en présence, soit hors présence des futurs époux. S’il y a un accord, le tribunal prend une décision qui l’entérine. Dans le cas contraire, il statue par décision motivée accordant ou non l’autorisation du mariage et fixant le montant de la dot en tenant compte de la coutume des parties et des possibilités financières du futur époux et de sa famille. En ce cas, le mariage ne peut être célébré que devant l’officier de l’état civil qui, sur la base de la décision, recevra le montant de la dot fixé et veillera à la remettre à ceux qui doivent la recevoir. Si ces derniers refusent de la recevoir, l’officier de l’état civil en fera mention dans l’acte de mariage. Le montant de la dot ainsi versé et non recueilli sera, après un an à dater de l’acte de mariage, soumis aux règles relatives aux offres réelles et à la consignation.
                      alineas:
