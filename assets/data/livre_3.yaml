      - type: chapitre
        numero: II
        intitule: "DES CONDITIONS DE L'ADOPTION"
        ordre: 2
        chemin: "3.3.2"
        articles:
          - numero: "653"
            numero_tri: 653.0
            ordre: 653
            version:
              num_version: 1
              statut: en_vigueur
              texte_source: null
              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                Ne peuvent adopter que les personnes majeures et capables, à l’exception de celles qui sont déchues de l’autorité parentale, des homosexuels, des transsexuels, des pédophiles et des personnes souffrant des troubles psychiques. L’adoptant doit donner la preuve de son engagement à œuvrer avec la famille de l’enfant dont l’adoption est sollicitée ainsi que les autorités administratives nationales chargées de l’adoption, à assurer la prise en charge de l’enfant au sein de sa propre famille ou communauté, afin de garantir la continuité de son éducation, dans son environnement socioculturel naturel.
                Si cela s’avère matériellement irréalisable, l’adoption internationale de l’enfant congolais ne pourrait être accordée que si, en sus des conditions prescrites à l’article 651 alinéa 2 de la présente loi, les autorités compétentes de l’Etat d’accueil délivrent des attestations constatant que : •
                l’adoptant est apte à adopter et à fournir à l’enfant un cadre d’épanouissement acceptable ;
                •
                l’adoptant a l’extrait de casier judiciaire vierge et est de moralité publique irréprochable.
              alineas:
                - ordre: 1
                  type: alinea
                  contenu: |-
