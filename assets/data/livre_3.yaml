                              Si le consentement n'a été donné que par suite d'une erreur sur une qualité essentielle, physique, civile ou morale de l'un des époux, ou par suite d'une autre erreur substantielle, la nullité du mariage peut être demandée par l'époux qui a été induit en erreur. Le mariage ne peut plus être attaqué six mois après que l'erreur a été découverte et, en toute hypothèse, deux ans après que le mariage a été célébré.
