                        1.un extrait de l’acte de naissance de chacun des époux ;
                        2.la copie des actes accordant des dispenses dans les cas prévus par la loi ;
                        3.le cas échéant, les copies des actes constatant le consentement des parents ou du tuteur, les procurations écrites prévues par la loi. Celui des époux qui est dans l’impossibilité de se procurer son extrait d’acte de naissance peut y suppléer en rapportant un acte de notoriété délivré par le juge de paix de son lieu de naissance, de son domicile ou de sa résidence, conformément aux dispositions relatives à l’état civil.
