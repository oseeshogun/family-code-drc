                      contenu: |-
                        La succession du conjoint prédécédé doit des aliments au conjoint survivant. Le délai pour le réclamer est d'un an à partir du décès et se prolonge, en cas de partage, jusqu'à son achèvement. Les aliments se prélèvent sur l'héritage. Ils sont supportés par tous les héritiers, et en cas d'insuffisance, par tous les légataires particuliers, proportionnellement à leur émolument. Si les aliments ne sont pas prélevés en capital sur la succession, des sûretés suffisantes seront données au bénéficiaire. Cette obligation cesse si le conjoint survivant se remarie.
                      alineas:
