                        Le mariage peut être célébré en famille selon les formalités prescrites par les coutumes. Dans ce cas, l'officier de l'état civil enregistre le mariage et dresse un acte le constatant. Le mariage peut également être célébré par l'officier de l'état civil selon les formalités prescrites par la présente loi. En ce cas, l'officier de l'état civil dresse aussitôt un acte de mariage.
