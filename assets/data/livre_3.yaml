                  contenu: |-
                    L'engagement de ne pas se marier, ou le ne pas se remarier pris par une personne, est sans effet au regard de la loi. L'officier de l'état civil n'en tient aucun compte. Toute condition ou tout terme dont dépendent la naissance, la modification ou l'extinction d'un droit ou d'une obligation, et visant à exclure ou à retarder le mariage d'une personne, est de nul effet et n'affecte pas la naissance, la modification ou l'extinction du droit ou de l'obligation.
