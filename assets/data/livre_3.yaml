                  - numero: "400"
                    numero_tri: 400.0
                    ordre: 399
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Le tribunal ne prononce la nullité que pour l'avenir. Exceptionnellement, il prononce la nullité avec effet rétroactif, soit parce que la loi l'impose soit en raison de la gravité des circonstances. A cet effet, il considère en particulier la bonne ou la mauvaise foi des époux, le fait que le mariage a été ou non consommé, l'intérêt des enfants éventuellement nés de l'union déclarée nulle et l'intérêt des tiers de bonne foi. Le tribunal règle selon l'équité les conséquences de la nullité. Les enfants issus du mariage déclaré nul, conservent vis-à-vis de leurs père et mère la filiation qui leur avait été conférée par le mariage, même si celui-ci est déclaré nul avec effet rétroactif.
                        Le tribunal s'inspire des règles prescrites pour la liquidation des rapports entre époux dans le cas de divorce.
