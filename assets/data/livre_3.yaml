                  statut: en_vigueur
                  texte_source: null
                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Sous réserve des dispositions de l’article 289 de la présente loi, les père et mère ont l’administration et la jouissance des biens de leur enfant jusqu’à sa majorité. Les revenus de ces biens sont, par priorité, consacrés à l’entretien et à l’éducation de l’enfant. En tout état de cause, cette jouissance ne s’étend pas aux biens provenant d’un travail séparé de l’enfant, ni à ceux qui lui seront donnés ou légués sous la condition expresse d’exclusion d’une telle jouissance, ni aux biens provenant d’une succession dont le père ou la mère ont été exclus comme indignes.
