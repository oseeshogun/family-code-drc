                            Outre les cas prévus aux articles 558 alinéa 1er et 561 alinéa 6 de la présente loi, l’action en divorce ne peut être introduite après le décès de l’un des époux ou après la réconciliation des époux survenue en cours des instances de conciliation ou après le désistement exprès de l’époux requérant. Outre le cas prévu à l’article 565 alinéa 1er de la présente loi, l’action en divorce s’éteint soit par le décès de l’un des époux survenu avant que le jugement prononçant le divorce soit devenu définitif, soit par la réconciliation des époux survenue au cours de la procédure en divorce ou après le désistement exprès de l’époux demandeur. Toutefois, en cas de désistement, s’il y a eu demande reconventionnelle, celle-ci demeure.
