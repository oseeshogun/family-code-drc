                  - numero: "371"
                    numero_tri: 371.0
                    ordre: 370
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Lorsqu’un fait susceptible de constituer un empêchement au mariage en vertu des articles 351 à 356 et 360 à 362 de la présente loi est porté à la connaissance de l’officier de l’état civil compétent, celui-ci sursoit à l’enregistrement et en avise le président du tribunal de paix dans les quarante-huit heures. Dans les huit jours, le Président du Tribunal de paix ordonne à l’officier de l’état civil soit de passer outre, soit de surseoir à l’enregistrement du mariage. Dans ce dernier cas, le greffier notifie l’ordonnance d’opposition aux époux et à l’officier de l’état civil et cite les époux ainsi que leurs témoins à comparaître dans les quinze jours devant le tribunal pour plaider sur les mérites de l’opposition. Le jugement est prononcé dans les huit jours, sauf s’il y a lieu à enquêter. La procédure est gratuite. Si le Tribunal de paix prononce la nullité du mariage, le dispositif du jugement est transmis par le greffier à l’officier de l’état civil qui en assure la transcription en marge de l’acte du mariage et la publicité dans les formes prévues à l’alinéa 5 de l’article 370 ci-dessus.
