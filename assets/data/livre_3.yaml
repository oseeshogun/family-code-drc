                L’existence d’enfants chez l’adoptant ne fait pas obstacle à l’adoption. Toutefois, l’adoption n’est permise qu’aux personnes qui, au jour de l’adoption, ont moins de trois enfants en vie, sauf dispense accordée par le Gouverneur de province ou de la ville de Kinshasa. Nul ne peut adopter plus de trois enfants, sauf s’il s’agit des enfants de son conjoint.
