              contenu: |-
                Le jugement relatif à l'adoption est susceptible d'appel et de recours en cassation par les adoptants, l'adopté, par ceux dont le consentement est requis ainsi que par le ministère public. Le délai commence à courir à compter de la décision. L'adoption prononcée par une décision passée en force de chose jugée ne peut être attaquée par voie de nullité. La requête civile n'est recevable que si elle émane de l'adoptant, des époux adoptants ou de l'un d'eux ou de l'adopté et pour autant qu'elle soit signifiée dans les trois mois du jour où le requérant a eu connaissance de la cause sur laquelle il appuie sa requête. Les jugements refusant de prononcer l'adoption ne font pas obstacle à l'introduction ultérieure d'une demande semblable fondée sur d'autres éléments de faits découverts ou survenus depuis la décision de rejet. Le cas échéant, de nouveaux actes constatant les consentements requis devront être produits.
