              - type: paragraphe
                numero: "2"
                intitule: "De la célébration du mariage en famille et de son enregistrement"
                ordre: 2
                chemin: "3.1.3.3.2"
                articles:
                  - numero: "369"
                    numero_tri: 369.0
                    ordre: 368
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        La célébration du mariage en famille se déroule conformément aux coutumes des parties, pour autant que ces coutumes soient conformes à la loi, à l’ordre public et aux bonnes mœurs.
                        En cas de conflit des coutumes, la coutume de la femme est d’application.
                      alineas:
                        - ordre: 1
                          type: alinea
                          contenu: |-
                              La célébration du mariage en famille se déroule conformément aux coutumes des parties, pour autant que ces coutumes soient conformes à la loi, à l’ordre public et aux bonnes mœurs.
