                          date_fin_vigueur: null
                          contenu: |-
                            Dans le cas où le jugement sur le fond ne peut être immédiatement prononcé, le tribunal statue à la demande des parties ou d'office sur la résidence des époux durant l'instance, sur la remise des effets personnels et s'il y a lieu sur la garde provisoire des enfants, sur le droit de visite des parents, sur les demandes d'alimen1s et de provisions durant l'instance et, de façon générale, ordonne, même d'office, toutes les mesures provisoires conservatoires ou urgentes qui lui paraissent nécessaires pour la sauvegarde des intérêts des enfants ou de chacun des époux. S'il y a des enfants, il peut également commettre toute personne qualifiée pour recueillir des renseignements sur la situation matérielle et morale du ménage, sur les conditions dans lesquelles les enfants vivent, sont gardés et éduqués et donner son avis sur les mesures à prendre quant à l'attribution définitive de la garde. Les mesures provisoires peuvent être modifiées ou complétées en cours d'instance. Les jugements qui les ordonnent sont exécutoires par provision nonobstant tout recours.
