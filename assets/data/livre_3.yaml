                      contenu: |-
                        L’appel est formé par déclaration au greffe du Tribunal de paix qui a statué dans le délai de quinze jours francs à dater de la signification du jugement. Les pièces de la procédure sont transmises dans les quarante-huit heures au greffe du Tribunal de grande instance. La cause est inscrite au rôle de la première audience utile et le jugement, prononcé à l’audience suivante, est toujours réputé contradictoire. Le jugement d’appel est notifié par le Ministère public aux époux et à l’officier de l’état civil qui, en cas de nullité, en assure la transcription et la publicité comme prévu à l’article précédent.
