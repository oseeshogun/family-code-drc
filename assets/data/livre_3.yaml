                                  type: alinea
                                  contenu: |-
                                      Lorsque par la volonté des conjoints, la gestion des biens n’est pas conjointe, chacun des conjoints administre ses biens et en perçoit les revenus. Ils peuvent en disposer librement sauf ce qui est stipulé à l’article 499 de la présente loi.
