                      contenu: |-
                        L'obligation alimentaire est d'ordre public. Le créancier ne peut renoncer par convention aux arrérages à échoir.
                      alineas:
                        - ordre: 1
                          type: alinea
                          contenu: |-
                              L'obligation alimentaire est d'ordre public. Le créancier ne peut renoncer par convention aux arrérages à échoir.
                      renvois: []
                  - numero: "751"
                    numero_tri: 751.0
                    ordre: 754
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        L'obligation alimentaire est exclusivement attachée à la personne du créancier et du débiteur. L'obligation alimentaire est intransmissible à cause de mort. L'obligation alimentaire est incessible. Elle peut toutefois même avant l'échéance, faire l'objet d'une cession au profit des œuvres d'assistance qui pourvoient aux besoins du bénéficiaire de la créance. L'obligation alimentaire est insaisissable. Elle peut toutefois être saisie par les personnes qui ont fourni au bénéficiaire de la créance ce qui était nécessaire à son existence. L'obligation alimentaire ne peut être éteinte par la compensation.
