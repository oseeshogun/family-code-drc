                    ordre: 361
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        La coutume applicable au mariage détermine les débiteurs et les créanciers de la dot, sa consistance et son montant, pour autant qu'elle soit conforme à l'ordre public et à la loi, plus particulièrement aux dispositions qui suivent. Cette coutume détermine également les témoins matrimoniaux de la dot.
                      alineas:
