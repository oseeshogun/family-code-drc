                      - numero: "487"
                        numero_tri: 487.0
                        ordre: 486
                        version:
                          num_version: 1
                          statut: en_vigueur
                          texte_source: null
                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            La loi organise trois régimes entre lesquels les futurs époux ou les époux optent. Ce sont: a) la séparation des biens; b) la communauté réduite aux acquêts; c) la communauté universelle.
                          alineas:
                            - ordre: 1
                              type: alinea
                              contenu: |-
                                  La loi organise trois régimes entre lesquels les futurs époux ou les époux optent. Ce sont: a) la séparation des biens; b) la communauté réduite aux acquêts; c) la communauté universelle.
                          renvois: []
                      - numero: "488"
                        numero_tri: 488.0
                        ordre: 487
                        version:
                          num_version: 1
                          statut: en_vigueur
                          texte_source: null
                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            Au moment où les futurs conjoints ou les conjoints se présentent devant l’officier de l’état civil, par eux-mêmes ou par leur mandataire, en vue de la célébration ou de l’enregistrement du mariage, l’officier de l’état civil les avertit du choix qu’ils peuvent faire entre les trois régimes matrimoniaux organisés par la loi, et qu’à défaut pour eux de se prononcer, le régime matrimonial qui leur est applicable est celui de la communauté réduite aux acquêts. Afin de permettre aux conjoints ou aux futurs conjoints de réfléchir sur le régime à choisir, l’officier de l’état civil explique les régimes matrimoniaux au moment de la publication des bans telle qu’elle est prévue et organisée, pour le cas de l’enregistrement du mariage célébré en famille à l’article 370 et pour le cas du mariage célébré par l’officier de l’état civil à l’article 384 de la présente loi.
                            Au moment de la célébration du mariage ou de l’enregistrement de celui-ci, l’officier de l’état civil leur demande de fixer leur choix. Il acte leur réponse ou le manque de réponse dans l’acte de mariage.
                          alineas:
                            - ordre: 1
                              type: alinea
                              contenu: |-
                                  Au moment où les futurs conjoints ou les conjoints se présentent devant l’officier de l’état civil, par eux-mêmes ou par leur mandataire, en vue de la célébration ou de l’enregistrement du mariage, l’officier de l’état civil les avertit du choix qu’ils peuvent faire entre les trois régimes matrimoniaux organisés par la loi, et qu’à défaut pour eux de se prononcer, le régime matrimonial qui leur est applicable est celui de la communauté réduite aux acquêts. Afin de permettre aux conjoints ou aux futurs conjoints de réfléchir sur le régime à choisir, l’officier de l’état civil explique les régimes matrimoniaux au moment de la publication des bans telle qu’elle est prévue et organisée, pour le cas de l’enregistrement du mariage célébré en famille à l’article 370 et pour le cas du mariage célébré par l’officier de l’état civil à l’article 384 de la présente loi.
                            - ordre: 2
                              type: alinea
                              contenu: |-
