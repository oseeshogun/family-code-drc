                          contenu: |-
                            Dans le délai d'un mois à compter de la date à laquelle la décision de divorce n'est plus susceptible de voie de recours, le greffier remet à chacun des époux un extrait du jugement. Il fait parvenir à l'officier de l'état civil du lieu où le mariage a été célébré une expédition du même jugement, aux fins de transcription du dispositif sur les registres de l'état civil du lieu de célébration du mariage, en marge de l'acte de mariage et de l'acte de naissance des anciens époux, conformément aux dispositions relatives à l’état civil. Mention du divorce est portée au livret de ménage par les soins du greffier du tribunal de paix qui a rendu la décision devenue définitive. Lorsque l'un des époux est commerçant, mention du divorce est portée au registre de commerce dans le même délai. Les mentions prescrites aux alinéas précédents peuvent être requises directement par les parties, sur présentation de l'extrait du jugement et d'un certificat délivré par le greffier attestant que la décision n'est plus susceptible de voie de recours.
