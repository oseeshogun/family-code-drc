              contenu: |-
                Le père et la mère de l’adopté mineur doivent tous deux consentir à l’adoption.
                Si l’un des parents est décédé, se trouve dans l’impossibilité de manifester sa volonté, n’a aucune demeure connue ou s’il est déchu de l’autorité parentale, le consentement sera donné conjointement par l’autre époux et un membre de la famille de son conjoint désigné par le Tribunal pour enfants, sur proposition du conseil de famille. Lorsque la filiation d’un mineur n’est établie qu’à l’égard de l’un de ses auteurs, celui-ci consent seul à l’adoption.
