              date_fin_vigueur: null
              contenu: |-
                L'indication du nom de la mère sur l'acte de naissance de l'enfant suffit à établir la filiation maternelle. Toutefois, la femme dont le nom est indiqué dans l'acte peut contester être la mère de l'enfant lorsqu'elle n'a pas été l'auteur de la déclaration de naissance.
              alineas:
