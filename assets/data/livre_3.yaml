                          contenu: |-
                            Le requérant qui réside à l’étranger lors du dépôt de la requête, peut la faire remettre au Président du Tribunal de paix de la résidence de l’autre époux ou de la dernière résidence conjugale par un mandataire spécial. Le Président du Tribunal de paix, après avoir convoqué l’autre époux conformément aux dispositions de l’article 558 de la présente loi, peut, par ordonnance motivée, accorder la dispense de la comparution du requérant en précisant les circonstances justifiant réellement celle-ci. Il acte les observations de l’autre époux, et peut, dans le but de resserrer les liens conjugaux, convoquer les personnes qu’il estime susceptibles d’y aboutir pour recueillir leurs avis. Il envoie à l’époux requérant, les observations de l’autre époux et les avis des personnes éventuellement entendues. Dans les six mois à dater de la réception des documents envoyés par lettre recommandée à l’adresse du requérant, celui-ci doit déclarer qu’il persévère ou non dans sa requête en divorce. A défaut de donner réponse dans ce délai, le requérant est présumé se désister de sa requête, sauf cas de force majeure.
                          alineas:
