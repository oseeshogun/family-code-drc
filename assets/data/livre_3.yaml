                      contenu: |-
                        Lors de la célébration du mariage, l'officier de l'état civil, même en l'absence de toute mention marginale, demande aux futurs époux s'ils ont déjà été mariés et leur enjoint, dans l'affirmative, d'indiquer la date et la forme de l'union précédente ainsi que la date et les causes de sa dissolution ou de son annulation. L'officier de l'état civil demande aux futurs époux la valeur et la composition de la dot ainsi que les modalités de son règlement. Il les interpelle sur le régime matrimonial qu'ils entendent choisir et leur explique qu'en l'absence de toute option, ils seront placés sous le régime légal.
