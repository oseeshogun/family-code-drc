                              Sans préjudice de l’application de la théorie du mandat domestique tacite, chaque conjoint, en concertation avec l’autre, dispose du pouvoir de conclure des contrats relatifs aux charges du ménage. Les conjoints répondent solidairement des dettes ainsi contractées. Cette solidarité n’a pas lieu lorsque les dépenses ainsi réalisées par un conjoint présentent un caractère manifestement exagéré par rapport au train de vie du ménage ou lorsqu’elles ont été contractées avec un tiers de mauvaise foi.
