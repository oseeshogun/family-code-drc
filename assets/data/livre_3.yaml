                            Avant l’instruction de la cause, le tribunal peut encore, à la demande des parties ou même d’office, ordonner que celles-ci se présentent devant des réunions de famille selon des modalités qu’il précise. La conciliation intervenue en cours d’instance est constatée par le tribunal ; elle éteint l’action. En cas de non-conciliation, les conseils des parties étant éventuellement entendus, le tribunal statue et peut, soit retenir l’affaire immédiatement et se prononcer sur l’action en divorce, soit la renvoyer à une audience ultérieure dont il indique la date. Lorsque le demandeur n’a pas assisté au prononcé de l’ordonnance de non-conciliation, le tribunal le fait convoquer pour la première audience utile.
