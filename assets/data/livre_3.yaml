                  date_debut_vigueur: null
                  date_fin_vigueur: null
                  contenu: |-
                    Tout enfant né hors mariage doit faire l’objet d’une affiliation dans les douze mois qui suivent sa naissance. Passé ce délai, l’affiliation ne pourra se faire que moyennant paiement d’une amende allant de 50.000 à 100.000 francs congolais. Si le père refuse d’affilier son enfant né hors mariage et lorsque l’action en recherche de paternité est déclarée fondée, le jugement vaut affiliation et mention en est faite dans l’acte de naissance de l’enfant. Dans ce cas, le père sera puni d’une peine d’une servitude pénale principale de dix à trente jours et d’une amende de 100.000 à 500.000 francs congolais ou de l’une de ces peines seulement.
                  alineas:
                    - ordre: 1
                      type: alinea
                      contenu: |-
                          Tout enfant né hors mariage doit faire l’objet d’une affiliation dans les douze mois qui suivent sa naissance. Passé ce délai, l’affiliation ne pourra se faire que moyennant paiement d’une amende allant de 50.000 à 100.000 francs congolais. Si le père refuse d’affilier son enfant né hors mariage et lorsque l’action en recherche de paternité est déclarée fondée, le jugement vaut affiliation et mention en est faite dans l’acte de naissance de l’enfant. Dans ce cas, le père sera puni d’une peine d’une servitude pénale principale de dix à trente jours et d’une amende de 100.000 à 500.000 francs congolais ou de l’une de ces peines seulement.
