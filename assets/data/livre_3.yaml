                      - type: subdivision
                        numero: C
                        intitule: "Du régime de la communauté universelle"
                        ordre: 3
                        chemin: "3.1.5.4.2.2.3"
                        articles:
                          - numero: "533"
                            numero_tri: 533.0
                            ordre: 532
                            version:
                              num_version: 1
                              statut: en_vigueur
                              texte_source: null
                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                Le régime de la communauté universelle consacre entre les époux la communauté de tous les biens, tant meubles qu'immeubles ainsi que de leurs dettes présentes et à venir. Resteront cependant propres aux époux, les biens mobiliers et immobiliers qu'ils recueilleront à titre gratuit avec exclusion de communauté et les biens qui leur sont strictement personnels ainsi que le capital d'assurance-vie, les indemnités compensatoires d'un préjudice physique ou moral, les rentes alimentaires, pension de retraite et d'invalidité.
                              alineas:
                                - ordre: 1
                                  type: alinea
                                  contenu: |-
                                      Le régime de la communauté universelle consacre entre les époux la communauté de tous les biens, tant meubles qu'immeubles ainsi que de leurs dettes présentes et à venir. Resteront cependant propres aux époux, les biens mobiliers et immobiliers qu'ils recueilleront à titre gratuit avec exclusion de communauté et les biens qui leur sont strictement personnels ainsi que le capital d'assurance-vie, les indemnités compensatoires d'un préjudice physique ou moral, les rentes alimentaires, pension de retraite et d'invalidité.
