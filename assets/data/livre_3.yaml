                          date_fin_vigueur: null
                          contenu: |-
                            A l'audience de conciliation au cours de laquelle le président du tribunal de paix constate l'échec définitif de la conciliation, il fixe la date de l'introduction de l'action en divorce devant le tribunal de paix, en tenant compte éventuellement du délai d'ajournement. Cette décision est notifiée verbalement et sur le champ aux époux. En cas d'absence de l'époux défendeur, la décision lui sera notifiée par le greffier. Si le requérant réside à l'étranger et qu'il a obtenu la dispense de comparaître, le président fixe la date d'audience dès qu'il a reçu la décision du requérant de continuer la poursuite de la cause. Il lui fait notifier par le greffier la date de l'introduction de l'action en divorce.
