                          contenu: |-
                            En cas d'appel la cause est débattue en chambre du conseil et le jugement rendu en audience publique. Les demandes reconventionnelles peuvent être formées en appel sans être considérées comme demandes nouvelles. Les voies de recours ordinaires ou extraordinaires exercées contre les décisions rendues en matière de divorce ont, ainsi que leurs délais, un effet suspensif. Le jugement qui prononce le divorce n'est pas susceptible d'acquiescement.
