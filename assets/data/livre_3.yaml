                      - numero: "559"
                        numero_tri: 559.0
                        ordre: 558
                        version:
                          num_version: 1
                          statut: en_vigueur
                          texte_source: null
                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            A l’audience indiquée, la partie ou les parties requérantes comparaissent à huis clos devant le Président du Tribunal de paix et hors de la personne de leurs conseils. Le Président, après avoir précisé les griefs du requérant et entendu les observations de l’autre époux ou précisé celles-ci, si ce dernier ne comparaît pas, tente en amiable conciliateur de resserrer les liens conjugaux. Il peut, dans un but de rapprochement des époux, convoquer les personnes qu’il estime susceptibles de favoriser celui-ci, ajourner la suite de l’instance pour une durée maximum de six mois lorsque le rapprochement n’est pas exclu. Ce délai d’ajournement est obligatoirement de six mois si les enfants sont à charge des parents. En cas de non-comparution de l’autre époux, le délai d’ajournement lui est notifié à la diligence du greffier. Les décisions prises lors des audiences de conciliation unilatérales et bilatérales ne sont pas susceptibles d’appel.
