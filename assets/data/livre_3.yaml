                              contenu: |-
                                Au moment de la célébration ou de l'enregistrement du mariage, si les époux optent pour la communauté réduite aux acquêts, ou à défaut de déclaration d'option, ils peuvent établir et remettre à l'officier de l'état civil qui célèbre ou enregistre leur mariage, un inventaire signé par eux et précisant les biens meubles et immeubles dont ils ont la propriété ou la possession légale antérieurement au mariage. Ce document est mentionné dans l'acte de mariage et fait pleine foi de l'appartenance de biens sauf preuve légale contraire, en matière de biens fonciers et immobiliers enregistrés.
