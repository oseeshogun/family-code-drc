                  - numero: "384"
                    numero_tri: 384.0
                    ordre: 383
                    version:
                      num_version: 1
                      statut: en_vigueur
                      texte_source: null
                      date_debut_vigueur: null
                      date_fin_vigueur: null
                      contenu: |-
                        Pendant quinze jours francs, l’officier de l’état civil assure la publicité du futur mariage par voie de proclamation faite au moins deux fois et/ou par voie d’affichage. Cette publicité énonce les noms, filiation, âge, profession, nationalité, domicile et/ou résidence des futurs époux ainsi que le lieu et la date de la célébration du mariage projeté. Elle est faite au bureau de l’état civil du lieu du mariage et à celui du lieu où chacun des futurs époux à son domicile ou, à défaut de domicile, sa résidence. Le Tribunal de paix du lieu de célébration du mariage peut dispenser, pour des causes graves, de la publicité et de tout délai.
                      alineas:
