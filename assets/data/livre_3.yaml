                      - numero: "494"
                        numero_tri: 494.0
                        ordre: 493
                        version:
                          num_version: 1
                          statut: en_vigueur
                          texte_source: null
                          date_debut_vigueur: null
                          date_fin_vigueur: null
                          contenu: |-
                            A la demande des époux et une fois durant le mariage, le régime matrimonial peut être modifié. Le demandeur doit prouver que la modification est exigée par l'intérêt du ménage ou par une modification importante intervenue dans la situation des époux ou de l'un d'entre eux. Le tribunal de paix compétent est celui de la dernière résidence conjugale des époux. Au cas où cette demande n'est pas accueillie, celle-ci ne peut être renouvelée qu'après deux ans à dater de la décision devenue définitive pour autant qu'elle s'appuie sur des éléments nouveaux.
                          alineas:
