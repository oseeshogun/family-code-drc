                              date_debut_vigueur: null
                              date_fin_vigueur: null
                              contenu: |-
                                A la dissolution du mariage, l'actif et le passif de la communauté sont partagés par moitié entre les anciens époux ou entre le conjoint survivant et les héritiers de l'autre époux. Les créances acquises avant la dissolution du mariage mais réglées par la suite sont dues par moitié par les débiteurs aux anciens époux ou au conjoint survivant et aux héritiers de l'autre époux. Les dettes contractées avant la dissolution du mariage pourront être poursuivies par les tiers solidairement, sur les patrimoines des anciens époux ou sur ceux du conjoint survivant et des héritiers de l'autre époux. Celui qui a réglé la dette dispose d'un droit de recours contre le ou les titulaires des autres patrimoines, en proportion de leur part, dans le partage de la communauté. Les dispositions relatives aux successions et concernant les modalités de partage, les rapports entre cohéritiers après le partage et les droits des créanciers non réglés par le présent article, sont applicables par analogie au partage du patrimoine commun.
                              alineas:
                                - ordre: 1
                                  type: alinea
                                  contenu: |-
                                      A la dissolution du mariage, l'actif et le passif de la communauté sont partagés par moitié entre les anciens époux ou entre le conjoint survivant et les héritiers de l'autre époux. Les créances acquises avant la dissolution du mariage mais réglées par la suite sont dues par moitié par les débiteurs aux anciens époux ou au conjoint survivant et aux héritiers de l'autre époux. Les dettes contractées avant la dissolution du mariage pourront être poursuivies par les tiers solidairement, sur les patrimoines des anciens époux ou sur ceux du conjoint survivant et des héritiers de l'autre époux. Celui qui a réglé la dette dispose d'un droit de recours contre le ou les titulaires des autres patrimoines, en proportion de leur part, dans le partage de la communauté. Les dispositions relatives aux successions et concernant les modalités de partage, les rapports entre cohéritiers après le partage et les droits des créanciers non réglés par le présent article, sont applicables par analogie au partage du patrimoine commun.
