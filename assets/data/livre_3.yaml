                      contenu: |-
                        Tout créancier d'une pension alimentaire peut se faire payer directement le montant de cette pension par les tiers débiteurs de sommes liquides et exigibles envers le débiteur de la pension. Il peut notamment exercer ce droit entre les mains de tout débiteur de salaires, produits du travail ou autres revenus ainsi que de tout dépositaire de fonds. La demande en paiement direct sera fondée dès qu'une échéance d'une pension alimentaire, fixée par une décision judiciaire exécutoire, n'aura pas été exécutée à son terme.
