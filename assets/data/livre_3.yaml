                          date_fin_vigueur: null
                          contenu: |-
                            Quel que soit le régime choisi, lorsque l'un des époux ne peut justifier de la propriété ou de la concession exclusive d'un bien, celui-ci est présumé indivis. Les avantages matrimoniaux qui découlent de la répartition des charges entre les époux sont réputés, quel que soit le régime adopté, biens indivis. La qualité des biens propres ne peut être opposée à une tierce personne que si celle-ci connaissait ou devait connaître cette qualité.
                          alineas:
                            - ordre: 1
                              type: alinea
                              contenu: |-
