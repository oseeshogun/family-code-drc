                        Si l'un des époux manque gravement à ses devoirs, le président du tribunal de paix de la dernière résidence conjugale ordonne, sur requête verbale ou écrite de l'autre époux, les mesures urgentes et provisoires qu'exige l'intérêt de ce dernier et des enfants. Les pièces justificatives, s'il y en a, sont jointes à la requête. Les époux sont convoqués par le greffier devant le président qui statue dans les quinze jours de la requête. La convocation mentionne l'objet de la requête. L'ordonnance rendue en vertu des alinéas précédents est, à la diligence de l'époux qui l'a obtenue, notifiée par le greffier à l'autre époux.
