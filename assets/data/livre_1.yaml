              texte_source: null
              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                En cas de violation des dispositions des articles 22 et 34 de la présente Loi par l'impétrant, le Gouvernement rejette par Décret la demande d'acquisition ou de recouvrement de la nationalité congolaise. La décision de rejet est, endéans 3 mois à dater de la réception de la déclaration visant l'acquisition ou le recouvrement de la nationalité, notifiée à l'impétrant par le Ministre de la Justice et Garde des Sceaux.
                La décision de rejet peut faire l'objet d'un recours gracieux auprès du Président de la République, et le cas échéant, d'un recours en annulation devant la Cour Suprême de Justice.
