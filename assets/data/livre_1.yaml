              texte_source: null
              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                La preuve de la nationalité congolaise d'origine ou d'acquisition s'établit en produisant un certificat de nationalité régulièrement délivré par le Ministre ayant la nationalité dans ses attributions. Le certificat comporte les mentions et références prescrites par le Décret portant mesures d'exécution de la présente Loi, notamment les références précises du registre d'enregistrement, la date, la nature de l'acte en vertu duquel l'intéressé a la nationalité congolaise ainsi que les documents qui ont permis de l'établir. Le certificat de nationalité fait foi jusqu'à preuve du contraire.
              alineas:
                - ordre: 1
                  type: alinea
                  contenu: |-
                      La preuve de la nationalité congolaise d'origine ou d'acquisition s'établit en produisant un certificat de nationalité régulièrement délivré par le Ministre ayant la nationalité dans ses attributions. Le certificat comporte les mentions et références prescrites par le Décret portant mesures d'exécution de la présente Loi, notamment les références précises du registre d'enregistrement, la date, la nature de l'acte en vertu duquel l'intéressé a la nationalité congolaise ainsi que les documents qui ont permis de l'établir. Le certificat de nationalité fait foi jusqu'à preuve du contraire.
