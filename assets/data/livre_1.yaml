                  date_fin_vigueur: null
                  contenu: |-
                    Le Décret accordant la naturalisation est délibéré en Conseil des Ministres sur proposition du Ministre de la Justice et Garde des Sceaux. Le Président de la République signe ce Décret après avis conforme de l'Assemblée Nationale. Le requérant qui aura obtenu la naturalisation par Décret, sera admis à jouir de la qualité de citoyen congolais, mais seulement à partir du moment où il aura prêté serment, devant la Cour d'appel de sa résidence, d'être fidèle à la République Démocratique du Congo, de respecter ses lois, de n'invoquer dans ce territoire la protection d'un autre Etat, de ne jamais porter des armes contre lui et ses citoyens en faveur d'une autre puissance et de ne jamais contrecarrer ses intérêts.
