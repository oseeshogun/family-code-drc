              date_fin_vigueur: null
              contenu: |-
                Dans les 6 mois de la réception de la demande de naturalisation, il est procédé par les soins du Ministre de la Justice et Garde des Sceaux à une enquête sur l'honorabilité du requérant et à une publicité de cette demande. A l'issue de l'enquête, la demande de naturalisation, toutes les pièces de l'instruction ainsi que le projet de Décret portant naturalisation sont soumis aux délibérations du Conseil des Ministres. Après délibérations au Conseil des Ministres, le Gouvernement dépose à l'Assemblée Nationale pour avis conforme le dossier complet de la demande de naturalisation ainsi que les délibérations du Conseil des Ministres.
