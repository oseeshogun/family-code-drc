                    date du dépôt de la demande, la communauté de vie n'ait pas cessé entre les époux et que le conjoint congolais ait conservé sa nationalité. Le Décret ne peut être signé qu'après avis conforme de l'Assemblée Nationale. Ce Décret mentionne, le cas échéant, les noms des enfants mineurs concernés par l'effet collectif de la nationalité et prend effet à la date de sa signature. Il est publié au Journal Officiel et notifié à l'intéressé.
