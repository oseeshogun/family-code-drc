      - type: section
        numero: "2"
        intitule: "Des dispositions communes relatives à la nationalité congolaise d'acquisition"
        ordre: 2
        chemin: "1.3.2"
        articles:
          - numero: "22"
            numero_tri: 22.0
            ordre: 22
            version:
              num_version: 1
              statut: en_vigueur
              texte_source: null
              date_debut_vigueur: null
              date_fin_vigueur: null
              contenu: |-
                La nationalité congolaise par acquisition est soumise aux conditions suivantes:
                1. être majeur;
                2. introduire expressément une déclaration individuelle;
                3. déposer une déclaration d'engagement par écrit de renonciation à toute autre nationalité;
                4. savoir parler une des langues congolaises;
                5. être de bonne vie et mœurs;
                6. avoir à la date de la demande une résidence permanente en République Démocratique du Congo depuis 7 ans;
                7. ne s'être jamais livré au profit d'un Etat étranger, à des actes incompatibles avec la qualité de congolais, ou préjudiciables aux intérêts de la République Démocratique du Congo;
                8. n'avoir pas fait l'objet d'une condamnation définitive par les juridictions nationales ou étrangères pour l'une des infractions ci-après: a.
                haute trahison;
                b.
                atteinte à la sûreté de l'Etat;
                c.
                crimes de guerre, crimes de génocide, crimes contre l'humanité, crimes d'agression;
                d.
                crimes de terrorisme, assassinat, meurtre, viol, viol des mineurs et pédophilie;
                e.
                crimes économiques, blanchiment de capitaux, contrefaçon, fraude fiscale, fraude douanière, corruption, trafic d'armes, trafic de drogue.
              alineas:
